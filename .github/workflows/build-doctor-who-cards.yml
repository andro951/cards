name: Build Doctor Who Card Conjurer data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-doctor-who-cards.yml'
      - '_doctor_who_builder.xz.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Doctor Who card data
        shell: bash
        run: |
          python - <<'PYBUILD'
          import base64, io, json, lzma, time, urllib.request, urllib.error, urllib.parse
          from pathlib import Path

          original_urlopen = urllib.request.urlopen
          last_request = [0.0]

          def network_urlopen(*args, **kwargs):
              elapsed = time.monotonic() - last_request[0]
              if elapsed < 0.20:
                  time.sleep(0.20 - elapsed)
              for attempt in range(7):
                  try:
                      response = original_urlopen(*args, **kwargs)
                      last_request[0] = time.monotonic()
                      return response
                  except urllib.error.HTTPError as exc:
                      if exc.code != 429 or attempt == 6:
                          raise
                      retry_after = exc.headers.get('Retry-After')
                      try:
                          delay = float(retry_after) if retry_after else 2.0 * (2 ** attempt)
                      except ValueError:
                          delay = 2.0 * (2 ** attempt)
                      time.sleep(min(delay, 30.0))
                      last_request[0] = time.monotonic()

          names = [
              'Maskwood Nexus','Flooded Strand','Scalding Tarn','Crystal Quarry','Farewell',
              "Raffine's Tower",'Tempt with Discovery','The World Tree','Jodah, the Unifier','Savannah',
              'Misty Rainforest','Esika, God of the Tree // The Prismatic Bridge','Windswept Heath','Steam Vents',
              'Marsh Flats',"Spara's Headquarters",'Cascading Cataracts','Sol Ring','Morophon, the Boundless',
              'Polluted Delta','Arid Mesa','Propaganda','Forest',"Gaea's Cradle","Jetmir's Garden",'Everybody Lives!',
              'Mountain','Tundra','Godless Shrine','Swamp','Tropical Island','Zagoth Triome','Indatha Triome','Elven Chorus',
              'Ketria Triome','K-9, Mark I','Reflecting Pool','Brago, King Eternal','Watery Grave',"Akroma's Memorial",
              'The Fourteenth Doctor','Sonic Screwdriver','Plaza of Heroes','RMS Titanic','Mana Confluence','Sacred Foundry',
              'Raugrin Triome','Wedding Ring','Plains','Island'
          ]
          payload = json.dumps({'identifiers': [{'name': n} for n in names]}).encode('utf-8')
          request = urllib.request.Request(
              'https://api.scryfall.com/cards/collection',
              data=payload,
              headers={
                  'User-Agent': 'DoctorWhoCardConjurerBuilder/1.0',
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with network_urlopen(request, timeout=60) as response:
              collection = json.load(response)

          scryfall_cache = {}
          for obj in collection.get('data', []):
              scryfall_cache[obj.get('name','').casefold()] = obj
              for face in obj.get('card_faces', []) or []:
                  face_name = face.get('name')
                  if face_name:
                      scryfall_cache[face_name.casefold()] = obj

          class CachedResponse(io.BytesIO):
              def __init__(self, obj, url):
                  super().__init__(json.dumps(obj).encode('utf-8'))
                  self.url = url
                  self.status = 200
                  self.headers = {'Content-Type': 'application/json'}
              def __enter__(self):
                  return self
              def __exit__(self, exc_type, exc, tb):
                  self.close()
                  return False
              def getcode(self):
                  return 200
              def info(self):
                  return self.headers

          def cached_urlopen(request, *args, **kwargs):
              url = request.full_url if isinstance(request, urllib.request.Request) else str(request)
              parsed = urllib.parse.urlparse(url)
              if parsed.netloc == 'api.scryfall.com' and parsed.path == '/cards/named':
                  query = urllib.parse.parse_qs(parsed.query)
                  key = (query.get('exact') or query.get('fuzzy') or [''])[0].casefold()
                  if key in scryfall_cache:
                      return CachedResponse(scryfall_cache[key], url)
              return network_urlopen(request, *args, **kwargs)

          urllib.request.urlopen = cached_urlopen

          raw = Path('_doctor_who_builder.xz.b64').read_text().strip()
          code = lzma.decompress(base64.b64decode(raw))
          pseudo = str(Path.cwd() / '_build_doctor_who_cards.py')
          ns = {'__name__': '__main__', '__file__': pseudo}
          exec(compile(code, pseudo, 'exec'), ns)
          PYBUILD
      - name: Commit generated project data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doctor_who/doctor_who_cards.cardconjurer
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build Doctor Who Card Conjurer data"
            git push origin HEAD:main
          fi
