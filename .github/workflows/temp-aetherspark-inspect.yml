name: Inspect The Aetherspark

on:
  push:
    paths:
      - '.run-aetherspark-inspect'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            hulk_pack
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL
          sparse-checkout-cone-mode: true
      - name: Inspect live Scryfall object
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q=urllib.parse.urlencode({'exact':'The Aetherspark'})
          req=urllib.request.Request('https://api.scryfall.com/cards/named?'+q,headers={'User-Agent':'andro951-card-pipeline/1.0','Accept':'application/json;q=0.9,*/*;q=0.8'})
          with urllib.request.urlopen(req,timeout=30) as r:
              c=json.load(r)
          keys=['id','name','layout','mana_cost','type_line','oracle_text','loyalty','colors','color_identity','keywords','rarity','frame','frame_effects']
          print(json.dumps({k:c.get(k) for k in keys},indent=2,ensure_ascii=False))
          print('CARD_FACES=',json.dumps(c.get('card_faces'),indent=2,ensure_ascii=False))
          PY
