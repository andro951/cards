name: Normalize Derevi card text

on:
  push:
    paths:
      - '.normalize-derevi-text'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize against Derevi
        run: python derevi/normalize_to_derevi.py
      - name: Commit normalized card data
        run: |
          rm -f .normalize-derevi-text
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer derevi/STYLE_RULES.md derevi/PROXY_SYNC_STATUS.md .normalize-derevi-text
          git commit -m "Normalize Derevi proxy text and layout"
          git push
