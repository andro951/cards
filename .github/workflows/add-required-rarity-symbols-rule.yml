name: Add required rarity symbol rule
on:
  push:
    paths:
      - 'derevi/add_required_rarity_symbols_rule_trigger.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update style rules
        run: python derevi/add_required_rarity_symbols_rule.py
      - name: Commit update and clean temporary files
        run: |
          rm -f derevi/add_required_rarity_symbols_rule_trigger.txt
          rm -f derevi/add_required_rarity_symbols_rule.py
          rm -f .github/workflows/add-required-rarity-symbols-rule.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/STYLE_RULES.md derevi/add_required_rarity_symbols_rule_trigger.txt derevi/add_required_rarity_symbols_rule.py .github/workflows/add-required-rarity-symbols-rule.yml
          git commit -m "Require matching rarity symbols before finishing cards"
          git push origin main
