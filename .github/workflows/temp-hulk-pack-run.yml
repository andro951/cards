name: Hulk Pack art inventory diagnostic

on:
  push:
    paths:
      - '.github/workflows/temp-hulk-pack-run.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            hulk_pack
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL
          sparse-checkout-cone-mode: true
      - name: Fetch full Hulk Pack deck with missing-art tolerance
        working-directory: hulk_pack
        run: |
          python ../CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_deck_to_cardconjurer.py \
            "https://scryfall.com/@andro951/decks/3316831e-83b5-458c-bf88-1529930e24c8" \
            --allow-missing-art --no-compile
      - name: Compare every card face against art folder
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          mod_path=Path('CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_to_card_data.py')
          spec=importlib.util.spec_from_file_location('ingest',mod_path)
          ingest=importlib.util.module_from_spec(spec); spec.loader.exec_module(ingest)
          src=json.loads(Path('hulk_pack/generated_hulk_pack_card_data.json').read_text(encoding='utf-8'))
          cards=src['cards']; project=Path('hulk_pack')
          used=set(); missing=[]
          for card in cards:
              name=card['name']
              try:
                  fn=ingest.find_art_file(project,name,{},False)
                  used.add(fn)
              except Exception as exc:
                  missing.append({'name':name,'expected':ingest.snake_slug(name)+'.png','error':str(exc)})
          actual=sorted(p.name for p in (project/'art').iterdir() if p.is_file() and p.suffix.lower() in ingest.IMAGE_EXTENSIONS)
          extras=[x for x in actual if x not in used]
          report={'card_faces':len(cards),'art_files':len(actual),'matched_art_files':len(used),'missing_card_faces':missing,'unused_art_files':extras}
          Path('hulk_pack/art_inventory_report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hulk-pack-art-inventory-diagnostic
          path: |
            hulk_pack/generated_hulk_pack_card_data.json
            hulk_pack/art_inventory_report.json
          if-no-files-found: ignore
