name: Apply and test Prepare card support

on:
  push:
    paths:
      - '.prepare_support.patch'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .prepare_support.patch
            hulk_pack
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL
          sparse-checkout-cone-mode: true

      - name: Apply tested Prepare support patch
        run: |
          patch --dry-run -p0 < .prepare_support.patch
          patch -p0 < .prepare_support.patch
          python -m py_compile \
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_to_card_data.py \
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/card_data_to_cardconjurer.py \
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_deck_to_cardconjurer.py

      - name: Commit canonical Prepare support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_to_card_data.py \
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/card_data_to_cardconjurer.py
          git commit -m "Add native Prepare card support"
          git push

      - name: Run Hulk Pack from deck URL only
        working-directory: hulk_pack
        run: |
          python ../CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_deck_to_cardconjurer.py \
            "https://scryfall.com/@andro951/decks/3316831e-83b5-458c-bf88-1529930e24c8"

      - name: Verify Prepared card output
        run: |
          python - <<'PY'
          import json
          semantic=json.load(open('hulk_pack/generated_hulk_pack_card_data.json',encoding='utf-8'))['cards']
          names=[c['name'] for c in semantic]
          assert names.count('Demonic Tutor') == 1, names.count('Demonic Tutor')
          emeritus=[c for c in semantic if c['name']=='Emeritus of Woe']
          assert len(emeritus)==1
          assert emeritus[0].get('scryfall_layout')=='prepare'
          assert emeritus[0].get('prepared_spell',{}).get('name')=='Demonic Tutor'

          cc=json.load(open('hulk_pack/generated_hulk_pack_cards.cardconjurer',encoding='utf-8'))
          rendered=[e for e in cc if e.get('key')=='Emeritus of Woe']
          assert len(rendered)==1
          data=rendered[0]['data']
          assert data.get('version')=='prepare'
          assert data['text']['title2']['text']=='Demonic Tutor'
          assert data['text']['mana2']['text']=='{1}{B}'
          assert data['text']['type2']['text']=='Sorcery'
          assert 'Search your library for a card' in data['text']['rules2']['text']
          print('Prepared semantic and Card Conjurer output verified.')
          print('semantic card records:',len(semantic))
          print('Card Conjurer entries:',len(cc))
          PY

      - name: Upload generated Hulk Pack files
        uses: actions/upload-artifact@v4
        with:
          name: hulk-pack-with-prepare-support
          path: |
            hulk_pack/generated_hulk_pack_card_data.json
            hulk_pack/generated_hulk_pack_cards.cardconjurer
            hulk_pack/generated_hulk_pack_cards_FLAGGED_UNCHECKED_SAGAS.json
