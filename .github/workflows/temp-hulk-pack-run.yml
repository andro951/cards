name: Inspect Hulk Pack duplicate entries

on:
  push:
    paths:
      - '.github/workflows/temp-hulk-pack-run.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Demonic Tutor entries in Scryfall export
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://api.scryfall.com/decks/3316831e-83b5-458c-bf88-1529930e24c8/export/json'
          req=urllib.request.Request(url,headers={'User-Agent':'andro951-card-pipeline/1.0','Accept':'application/json;q=0.9,*/*;q=0.8'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          print('TOP LEVEL KEYS:', sorted(data) if isinstance(data,dict) else type(data).__name__)
          hits=[]
          def walk(obj,path='$'):
              if isinstance(obj,dict):
                  blob=json.dumps(obj,ensure_ascii=False)
                  if 'Demonic Tutor' in blob:
                      # Only report the smallest card-like objects, not every ancestor.
                      name=obj.get('name') or obj.get('card_name') or obj.get('cardName')
                      if name=='Demonic Tutor' or any(v=='Demonic Tutor' for v in obj.values() if isinstance(v,str)):
                          hits.append((path,obj))
                  for k,v in obj.items(): walk(v,f'{path}.{k}')
              elif isinstance(obj,list):
                  for i,v in enumerate(obj): walk(v,f'{path}[{i}]')
          walk(data)
          print('DEMONIC TUTOR HITS:',len(hits))
          for path,obj in hits:
              print('\nPATH',path)
              print(json.dumps(obj,indent=2,ensure_ascii=False,sort_keys=True))
          # Also print section-ish top-level structure compactly.
          def summarize(obj,path='$',depth=0):
              if depth>3: return
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      kl=k.lower()
                      if any(x in kl for x in ('section','board','category','zone','list')):
                          print('STRUCT',path+'.'+k, type(v).__name__, (len(v) if hasattr(v,'__len__') else ''))
                      summarize(v,path+'.'+k,depth+1)
              elif isinstance(obj,list):
                  for i,v in enumerate(obj[:5]): summarize(v,f'{path}[{i}]',depth+1)
          summarize(data)
          PY
