name: Inspect Prepared card metadata

on:
  push:
    paths:
      - '.run-inspect-prepared'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Emeritus of Woe Scryfall object
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://api.scryfall.com/cards/7eb9e83d-515d-4911-a06b-9982200277b2'
          req=urllib.request.Request(url,headers={'User-Agent':'andro951-card-pipeline/1.0','Accept':'application/json;q=0.9,*/*;q=0.8'})
          with urllib.request.urlopen(req,timeout=30) as r:
              card=json.load(r)
          print('name=',card.get('name'))
          print('layout=',card.get('layout'))
          print('type_line=',card.get('type_line'))
          print('keywords=',card.get('keywords'))
          print('card_faces=',len(card.get('card_faces',[])))
          for i,face in enumerate(card.get('card_faces',[])):
              print('FACE',i)
              for k in ('name','mana_cost','type_line','oracle_text','flavor_name','printed_name'):
                  print(' ',k,'=',face.get(k))
              print(' keys=',sorted(face.keys()))
          print('card keys=',sorted(card.keys()))
          PY
