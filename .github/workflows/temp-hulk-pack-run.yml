name: Hulk Pack full URL run

on:
  push:
    paths:
      - '.github/workflows/temp-hulk-pack-run.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Standardize Hulk set-symbol filenames
        run: |
          mv "hulk_pack/set_symbol/ChatGPT Image Aug 29, 2026, 12_41_39 PM.png" "hulk_pack/set_symbol/mythic.png"
          mv "hulk_pack/set_symbol/ChatGPT Image Aug 29, 2026, 12_54_26 PM (1).png" "hulk_pack/set_symbol/uncommon.png"
          mv "hulk_pack/set_symbol/ChatGPT Image Aug 29, 2026, 12_54_26 PM (2).png" "hulk_pack/set_symbol/common.png"
          mv "hulk_pack/set_symbol/ChatGPT Image Aug 29, 2026, 12_54_40 PM.png" "hulk_pack/set_symbol/rare.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hulk_pack/set_symbol
          git commit -m "Standardize Hulk Pack set symbol filenames"
          git push

      - name: Run Hulk Pack from deck URL only
        working-directory: hulk_pack
        run: |
          python ../CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_deck_to_cardconjurer.py "https://scryfall.com/@andro951/decks/3316831e-83b5-458c-bf88-1529930e24c8"

      - name: Upload generated Hulk Pack files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hulk-pack-full-current-pipeline
          path: |
            hulk_pack/generated_*_card_data.json
            hulk_pack/generated_*_cards.cardconjurer
            hulk_pack/*_FLAGGED_UNCHECKED_SAGAS.json
          if-no-files-found: ignore
