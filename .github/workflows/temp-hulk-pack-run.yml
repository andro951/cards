name: Hulk Pack full URL run

on:
  push:
    paths:
      - '.github/workflows/temp-hulk-pack-run.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest pipeline changes
        run: |
          patch --dry-run -p1 < .temp_latest_dual_setsymbol.patch
          patch -p1 < .temp_latest_dual_setsymbol.patch
          python -m py_compile \
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/card_data_to_cardconjurer.py \
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_to_card_data.py \
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_deck_to_cardconjurer.py

      - name: Commit latest canonical pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/card_data_to_cardconjurer.py
          git commit -m "Sync dual legendary gradients and set symbol alignment"
          git push

      - name: Run Hulk Pack from deck URL only
        working-directory: hulk_pack
        run: |
          python ../CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_deck_to_cardconjurer.py "https://scryfall.com/@andro951/decks/3316831e-83b5-458c-bf88-1529930e24c8"

      - name: Upload generated Hulk Pack files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hulk-pack-full-current-pipeline
          path: |
            hulk_pack/generated_*_card_data.json
            hulk_pack/generated_*_cards.cardconjurer
            hulk_pack/*_FLAGGED_UNCHECKED_SAGAS.json
          if-no-files-found: ignore
