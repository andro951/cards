name: Apply fallback visibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hide-scryfall-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: ProxyFoundry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch fallback visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ProxyFoundry/site/setup.js')
          text=p.read_text(encoding='utf-8')
          old='''      <label class="check-line" id="fallback-line"><input type="checkbox" id="art-fallback" ${s.source.fallback?'checked':''}><span>Use Scryfall artwork when a custom image is missing<small>Turn off to require matching custom art for every card.</small></span></label>'''
          new='''      <label class="check-line ${s.source.mode==='scryfall'?'hidden':''}" id="fallback-line"><input type="checkbox" id="art-fallback" ${s.source.fallback?'checked':''}><span>Use Scryfall artwork when a custom image is missing<small>Turn off to require matching custom art for every card.</small></span></label>'''
          if old not in text: raise SystemExit('fallback label source changed')
          text=text.replace(old,new,1)
          old="  $$('[data-mode]',root).forEach(b=>b.onclick=()=>{s.source.mode=b.dataset.mode;$$('[data-mode]',root).forEach(x=>x.classList.toggle('selected',x===b));$$('[data-source]',root).forEach(x=>x.classList.toggle('hidden',x.dataset.source!==s.source.mode));mark();});"
          new="  $$('[data-mode]',root).forEach(b=>b.onclick=()=>{s.source.mode=b.dataset.mode;$$('[data-mode]',root).forEach(x=>x.classList.toggle('selected',x===b));$$('[data-source]',root).forEach(x=>x.classList.toggle('hidden',x.dataset.source!==s.source.mode));$('#fallback-line',root).classList.toggle('hidden',s.source.mode==='scryfall');mark();});"
          if old not in text: raise SystemExit('source switch handler changed')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          t=Path('ProxyFoundry/tests/test_art_source_visibility.py')
          t.write_text('''from pathlib import Path\n\n\ndef test_scryfall_source_hides_custom_art_fallback_control():\n    source=Path("site/setup.js").read_text(encoding="utf-8")\n    assert 'class="check-line ${s.source.mode===\\'scryfall\\'?\\'hidden\\':\\'\\'}" id="fallback-line"' in source\n    assert "$('#fallback-line',root).classList.toggle('hidden',s.source.mode==='scryfall')" in source\n''',encoding='utf-8')
          PY
      - name: Test
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          cd ProxyFoundry
          python -m pytest -q tests/test_art_source_visibility.py tests/test_hosted_land_library.py
      - name: Commit app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/site/setup.js ProxyFoundry/tests/test_art_source_visibility.py
          git commit -m 'Hide custom fallback for Scryfall artwork'
          git push origin HEAD:main
