name: Autosave all settings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-autosave-all-settings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply autosave settings change
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:220]!r}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')

          replace('ProxyFoundry/site/settings.js',
              '<div class="notice info">Existing template geometry is never updated from Scryfall. This setting affects card metadata and artwork downloads, not your approved frame recipes.</div><button class="button primary" id="save-settings">Save settings</button><p id="settings-saved" class="subtitle-line"></p></section>',
              '<div class="notice info">Existing template geometry is never updated from Scryfall. This setting affects card metadata and artwork downloads, not your approved frame recipes.</div></section>')

          replace('ProxyFoundry/site/settings.js',
              "  $('#save-settings').onclick=()=>attempt(async()=>{const out=await api('/api/settings',{revision:settings.revision,refreshData:$('#global-refresh').checked,deletePermanently:$('#permanent-delete').checked});state.bootstrap.settings=out;toast('Settings saved.');await showSettings();});\n  $('#permanent-delete').onchange=()=>attempt(async()=>{const input=$('#permanent-delete'),value=input.checked,save=$('#save-settings');input.disabled=true;if(save)save.disabled=true;try{const out=await api('/api/settings',{revision:settings.revision,deletePermanently:value});Object.assign(settings,out);state.bootstrap.settings=out;toast(value?'Permanent deck deletion enabled.':'Decks will move to Trash.');}catch(e){input.checked=!value;throw e;}finally{if(document.body.contains(input))input.disabled=false;if(save&&document.body.contains(save))save.disabled=false;}});\n",
              "  async function persistToggle(input,key,onMessage,offMessage){\n    const value=input.checked,toggles=[$('#global-refresh'),$('#permanent-delete')].filter(Boolean);toggles.forEach(x=>x.disabled=true);\n    try{const out=await api('/api/settings',{revision:settings.revision,[key]:value});Object.assign(settings,out);state.bootstrap.settings=out;toast(value?onMessage:offMessage);}\n    catch(e){input.checked=!value;throw e;}\n    finally{toggles.forEach(x=>{if(document.body.contains(x))x.disabled=false;});}\n  }\n  $('#global-refresh').onchange=()=>attempt(()=>persistToggle($('#global-refresh'),'refreshData','Automatic Scryfall refresh enabled.','Using the normal Scryfall cache policy.'));\n  $('#permanent-delete').onchange=()=>attempt(()=>persistToggle($('#permanent-delete'),'deletePermanently','Permanent deck deletion enabled.','Decks will move to Trash.'));\n")

          replace('ProxyFoundry/tests/test_server.py',
              "    _,settings,_=request(s,'/api/settings',{'deletePermanently':True})\n    assert settings['deletePermanently'] is True\n    # This is a real workspace setting, not browser-only state: a fresh read\n    # from the server/workspace must retain it.\n    assert request(s,'/api/settings')[1]['deletePermanently'] is True\n    assert app.ws.global_settings()['deletePermanently'] is True\n",
              "    _,settings,_=request(s,'/api/settings',{'deletePermanently':True,'refreshData':True})\n    assert settings['deletePermanently'] is True and settings['refreshData'] is True\n    # These are real workspace settings, not browser-only state: a fresh read\n    # from the server/workspace must retain both of them.\n    reread=request(s,'/api/settings')[1]\n    assert reread['deletePermanently'] is True and reread['refreshData'] is True\n    assert app.ws.global_settings()['deletePermanently'] is True and app.ws.global_settings()['refreshData'] is True\n")

          replace('ProxyFoundry/tests/test_server.py',
              "    for token in ['permanent-delete','data-trash-inspect','data-trash-delete','empty-trash','/api/trash/empty',\"$('#permanent-delete').onchange\",'Object.assign(settings,out)','Saved immediately.']:\n        assert token in settings\n",
              "    for token in ['permanent-delete','global-refresh','data-trash-inspect','data-trash-delete','empty-trash','/api/trash/empty',\"$('#permanent-delete').onchange\",\"$('#global-refresh').onchange\",'persistToggle','Object.assign(settings,out)','Saved immediately.']:\n        assert token in settings\n    assert 'id=\\\"save-settings\\\"' not in settings and \"$('#save-settings')\" not in settings\n")
          PY
      - name: Verify JavaScript syntax
        run: node --check ProxyFoundry/site/settings.js
      - name: Test full Bulk Proxy Forge suite
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/site/settings.js ProxyFoundry/tests/test_server.py
          git commit -m 'Autosave workspace settings immediately'
          git push origin HEAD:main
