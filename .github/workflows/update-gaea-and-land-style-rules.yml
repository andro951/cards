name: Update Gaea Cradle and land style rules

on:
  push:
    paths:
      - '.github/workflows/update-gaea-and-land-style-rules.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply updates
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update.py
          python /tmp/update.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer derevi/STYLE_RULES.md
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Style Gaea's Cradle as borderless legendary land [skip ci]"
          git push
