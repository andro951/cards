name: Temporary transform debug # rerun
on:
  push:
    paths:
      - '.github/workflows/temp-transform-debug.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProxyFoundry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ProxyFoundry/requirements.txt
      - name: Print transform frame sources
        working-directory: ProxyFoundry
        run: |
          python - <<'PY'
          import io
          from PIL import Image
          from foundry.compiler import Compiler
          from foundry.images import ingest_image,rarity_variants
          from foundry.storage import Store
          from pathlib import Path
          root=Path('/tmp/transform-debug')
          store=Store(root)
          b=io.BytesIO();Image.new('RGB',(1200,1600),'#556677').save(b,'PNG')
          art=ingest_image(store,b.getvalue());symbols=rarity_variants(store,art['id'])
          settings={'symbols':symbols,'artist':''}
          card={'object':'card','id':'bf573fb7-fa6c-4df7-8e5e-1e071585361e','name':'The Everflowing Well // The Myriad Pools','layout':'transform','rarity':'rare','set':'lci','collector_number':'56','artist':'David Álvarez','card_faces':[
            {'name':'The Everflowing Well','mana_cost':'{2}{U}','type_line':'Legendary Artifact','oracle_text':'Transform this.','colors':['U'],'artist':'David Álvarez'},
            {'name':'The Myriad Pools','mana_cost':'','type_line':'Legendary Artifact Land','oracle_text':'{T}: Add {U}.','colors':[],'produced_mana':['U'],'artist':'David Álvarez'}]}
          c=Compiler(store)
          for i,face in enumerate(card['card_faces']):
              out=c.compile_face(card,face,i,{},settings,art['id'],art_origin='Scryfall selected printing')
              print('FACE',i,out['recipe'])
              for frame in out['data']['frames']:
                  print(repr(frame.get('name')),repr(frame.get('src')))
          PY
