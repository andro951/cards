name: Update Derevi type width to 1540

on:
  push:
    paths:
      - '.update-type-width-1540'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update type widths
        run: python derevi/update_type_width_1540.py
      - name: Commit type width update
        run: |
          rm -f .update-type-width-1540
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer derevi/STYLE_RULES.md .update-type-width-1540
          git commit -m "Set Derevi type text width to 1540"
          git push
