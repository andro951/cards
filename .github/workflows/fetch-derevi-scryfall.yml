name: Fetch Derevi Scryfall checklist

on:
  push:
    paths:
      - '.fetch-derevi-scryfall'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Scryfall checklist and card data
        run: python fetch_scryfall_deck.py --deck-id cac4a3fa-84f8-4b8e-b946-0d8a8086fd9d --output-dir derevi
      - name: Commit fetched data
        run: |
          rm -f .fetch-derevi-scryfall
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/scryfall_proxy_decklist.txt derevi/scryfall_proxy_cards.json derevi/scryfall_proxy_export.json .fetch-derevi-scryfall
          git commit -m "Fetch Derevi Scryfall proxy checklist"
          git push
