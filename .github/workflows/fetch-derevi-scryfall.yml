name: Time Lords art filename comparison

on:
  push:
    paths:
      - '.github/workflows/fetch-derevi-scryfall.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build semantic data allowing missing art
        working-directory: doctor_who
        run: |
          python ../CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_deck_to_cardconjurer.py "https://scryfall.com/@andro951/decks/134b9792-519a-4c61-8d7a-e3e35e8ca468" --allow-missing-art --no-compile
      - name: Compare generated face names to art filenames
        working-directory: doctor_who
        run: |
          python - <<'PY'
          import json, re, unicodedata
          from pathlib import Path

          def slug(text):
              text = unicodedata.normalize('NFKD', text)
              text = ''.join(ch for ch in text if not unicodedata.combining(ch))
              text = text.replace('Æ','AE').replace('æ','ae').replace('Œ','OE').replace('œ','oe')
              text = re.sub(r"['’]", '', text)
              text = re.sub(r'[^A-Za-z0-9]+', '_', text)
              return text.strip('_').lower()

          doc = json.loads(Path('generated_doctor_who_card_data.json').read_text())
          cards = doc['cards']
          required = {slug(c['name']): c['name'] for c in cards}
          art_files = [p.name for p in Path('art').iterdir() if p.is_file()]
          actual = {slug(Path(f).stem): f for f in art_files}

          print(f'GENERATED_FACES={len(cards)}')
          print(f'ART_FILES={len(art_files)}')
          print('MISSING_FROM_ART:')
          for k in sorted(required.keys() - actual.keys()):
              print(f'  {required[k]} -> expected slug {k}')
          print('EXTRA_ART_FILES:')
          for k in sorted(actual.keys() - required.keys()):
              print(f'  {actual[k]} -> slug {k}')
          PY
