name: Temporary combine three Scryfall buy lists

on:
  push:
    paths:
      - '.github/workflows/fetch-derevi-scryfall.yml'

permissions:
  contents: read

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and combine three Scryfall buy lists
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from collections import Counter

          deck_ids = [
              "ec4d440e-fb43-43fe-9037-2a5ce9009c6d",
              "3b3c2cfa-73ac-4d49-a9ce-1ce7080bc415",
              "066f858a-23b7-41cb-a6ad-debc51aa475b",
          ]

          headers = {
              "User-Agent": "CardDataDeckPipeline/1.0",
              "Accept": "application/json;q=0.9,*/*;q=0.8",
          }

          combined = Counter()
          per_deck = []

          for deck_id in deck_ids:
              url = f"https://api.scryfall.com/decks/{deck_id}/export/json"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=45) as response:
                  deck = json.load(response)

              entries = deck.get("entries")
              if not isinstance(entries, dict):
                  raise RuntimeError(f"Deck {deck_id} has no entries object")

              deck_total = 0
              deck_unique = set()
              unresolved = []

              for section, rows in entries.items():
                  if not isinstance(rows, list):
                      continue
                  for row in rows:
                      if not isinstance(row, dict):
                          continue
                      digest = row.get("card_digest")
                      if not isinstance(digest, dict):
                          raw = str(row.get("raw_text") or "").strip()
                          if raw:
                              unresolved.append(raw)
                          continue

                      name = str(digest.get("name") or "").strip()
                      if not name:
                          continue
                      name = name.split(" // ", 1)[0]
                      try:
                          qty = int(row.get("count", 1) or 1)
                      except (TypeError, ValueError):
                          qty = 1

                      combined[name] += qty
                      deck_total += qty
                      deck_unique.add(name)

              if unresolved:
                  raise RuntimeError(f"Deck {deck_id} has unresolved entries: {unresolved}")

              title = str(deck.get("name") or deck.get("title") or deck_id)
              per_deck.append((deck_id, title, deck_total, len(deck_unique)))

          lines = [
              f"{qty} {name}"
              for name, qty in sorted(combined.items(), key=lambda item: item[0].casefold())
          ]

          with open("combined_buylist_three.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print("=== DECK SUMMARY ===")
          for deck_id, title, total, unique in per_deck:
              print(f"{deck_id}\t{title}\t{total} copies\t{unique} unique")
          print(f"TOTAL COPIES\t{sum(combined.values())}")
          print(f"TOTAL UNIQUE\t{len(combined)}")
          print("=== COMBINED BUYLIST START ===")
          print("\n".join(lines))
          print("=== COMBINED BUYLIST END ===")
          PY

      - name: Upload combined list
        uses: actions/upload-artifact@v4
        with:
          name: combined-scryfall-buylist-three
          path: combined_buylist_three.txt
