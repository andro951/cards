name: Add Bulk Proxy Forge meld support

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-meld-support.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: ProxyFoundry

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch meld import and back handling
        run: |
          python - <<'PY'
          from pathlib import Path

          sources=Path('ProxyFoundry/foundry/sources.py')
          text=sources.read_text(encoding='utf-8')
          old="        return d\n    def import_deck(self,source,include_outside=False,refresh=False,progress=lambda *a:None,cancel=lambda:False):\n"
          new="        return self._expand_meld(d,refresh)\n    def _expand_meld(self,d,refresh=False):\n        if d.get('layout')!='meld':return d\n        result=next((p for p in d.get('all_parts') or [] if p.get('component')=='meld_result'),None)\n        if not result or result.get('id')==d.get('id'):return d\n        card=self.resolve_card(result.get('id') or result.get('name',''),refresh)\n        images=card.get('image_uris') or {}\n        meld_result={k:card.get(k) for k in ('id','name','artist','set','collector_number','rarity') if card.get(k) is not None}\n        meld_result['image_uris']={k:images[k] for k in ('png','large','normal','small') if images.get(k)}\n        return {**d,'_meld_proxy':True,'_meld_result':meld_result}\n    def import_deck(self,source,include_outside=False,refresh=False,progress=lambda *a:None,cancel=lambda:False):\n"
          assert old in text
          sources.write_text(text.replace(old,new,1),encoding='utf-8')

          domain=Path('ProxyFoundry/foundry/domain.py')
          text=domain.read_text(encoding='utf-8')
          old="    layout=str(parent.get('layout') or face.get('scryfall_layout') or 'normal')\n    tl=str(face.get('type_line') or '').lower()\n"
          new="    layout=str(parent.get('layout') or face.get('scryfall_layout') or 'normal')\n    if layout=='meld' and parent.get('_meld_proxy'):layout='normal'\n    tl=str(face.get('type_line') or '').lower()\n"
          assert old in text
          domain.write_text(text.replace(old,new,1),encoding='utf-8')

          workspace=Path('ProxyFoundry/foundry/workspace.py')
          text=workspace.read_text(encoding='utf-8')
          marker="    def prepare(self,ident,progress=lambda *a:None,cancel=lambda:False):\n"
          assert marker in text
          helper="    def _meld_back(self,sf,refresh=False):\n        result=sf.get('_meld_result') or {};images=result.get('image_uris') or {}\n        url=images.get('png') or images.get('large') or images.get('normal') or images.get('small')\n        if not url:raise ValidationError('Scryfall did not provide an image for the meld result.')\n        raw,_,_=self.net.fetch(url,refresh=refresh);return ingest_image(self.store,raw)['id']\n"
          text=text.replace(marker,helper+marker,1)
          old="            if sf.get('id'):\n                progress(done,total,'Checking cached metadata for '+c['name'])\n                sf=self.sources.resolve_card(sf['id'],refresh);c['scryfall']=sf\n            flavor_sf=self.sources.flavor_source(sf,s.get('flavorPolicy','auto'),c.get('sourceIsExact',True),refresh)\n"
          new="            if sf.get('id'):\n                progress(done,total,'Checking cached metadata for '+c['name'])\n                sf=self.sources.resolve_card(sf['id'],refresh);c['scryfall']=sf\n            if sf.get('_meld_result'):c['meldBackAsset']=self._meld_back(sf,refresh)\n            else:c.pop('meldBackAsset',None)\n            flavor_sf=self.sources.flavor_source(sf,s.get('flavorPolicy','auto'),c.get('sourceIsExact',True),refresh)\n"
          assert old in text
          workspace.write_text(text.replace(old,new,1),encoding='utf-8')

          orders=Path('ProxyFoundry/foundry/orders.py')
          text=orders.read_text(encoding='utf-8')
          old="                if c.get('backOverride'):back=c['backOverride']\n                elif len(faces)==2:back=self._render(faces[1],d['name'])\n"
          new="                if c.get('backOverride'):back=c['backOverride']\n                elif c.get('meldBackAsset'):back=c['meldBackAsset']\n                elif len(faces)==2:back=self._render(faces[1],d['name'])\n"
          assert old in text
          orders.write_text(text.replace(old,new,1),encoding='utf-8')

          deck=Path('ProxyFoundry/site/deck.js')
          text=deck.read_text(encoding='utf-8')
          old="function backPreview(c,d){\n  if(c.backOverride)return asset(c.backOverride);\n  if(c.faces.length===2)return preview(c,c.faces[1]);\n"
          new="function backPreview(c,d){\n  if(c.backOverride)return asset(c.backOverride);\n  if(c.meldBackAsset)return asset(c.meldBackAsset);\n  if(c.faces.length===2)return preview(c,c.faces[1]);\n"
          assert old in text
          deck.write_text(text.replace(old,new,1),encoding='utf-8')

          tests=Path('ProxyFoundry/tests/test_pipeline.py')
          text=tests.read_text(encoding='utf-8')
          marker='def test_exact_printing(workspace):\n'
          assert marker in text
          lines=[
            'def test_meld_import_uses_result_as_back_without_rendering_result(workspace):',
            '    from foundry.workspace import Workspace',
            '    from foundry.orders import Orders',
            '    s,a,settings=workspace',
            "    front_id='10000000-0000-4000-8000-000000000001';result_id='20000000-0000-4000-8000-000000000002'",
            "    parts=[{'id':front_id,'component':'meld_part','name':'Urza, Lord Protector'},{'id':result_id,'component':'meld_result','name':'Urza, Planeswalker'}]",
            "    front={'id':front_id,'name':'Urza, Lord Protector','layout':'meld','type_line':'Legendary Creature — Human Artificer','mana_cost':'{1}{W}{U}','oracle_text':'Artifact, instant, and sorcery spells you cast cost {1} less to cast.','colors':['W','U'],'rarity':'mythic','power':'2','toughness':'4','set':'bro','collector_number':'225','artist':'Front Artist','all_parts':parts,'image_uris':{'art_crop':'https://cards.scryfall.io/front.jpg'}}",
            "    result={'id':result_id,'name':'Urza, Planeswalker','layout':'meld','type_line':'Legendary Planeswalker — Urza','rarity':'mythic','set':'bro','collector_number':'238b','artist':'Back Artist','all_parts':parts,'image_uris':{'png':'https://cards.scryfall.io/result.png'}}",
            "    front_png=io.BytesIO();Image.new('RGB',(900,650),'#556677').save(front_png,'PNG')",
            "    result_png=io.BytesIO();Image.new('RGB',(1800,900),'#775533').save(result_png,'PNG')",
            '    calls=[]',
            '    def transport(url):',
            '        calls.append(url)',
            "        if url.endswith(front_id):return json.dumps(front).encode(),'application/json',{}",
            "        if url.endswith(result_id):return json.dumps(result).encode(),'application/json',{}",
            "        if url.endswith('result.png'):return result_png.getvalue(),'image/png',{}",
            "        return front_png.getvalue(),'image/png',{}",
            '    net=Network(s,transport=transport,sleeper=lambda n:None);ws=Workspace(s,net)',
            "    d=ws.create({'name':'Meld test','source':[{'id':front_id,'quantity':1}],'settings':settings});card=d['cards'][0]",
            "    assert card['scryfall']['_meld_result']['name']=='Urza, Planeswalker'",
            "    assert len(card['faces'])==1 and card['faces'][0]['name']=='Urza, Lord Protector'",
            "    d=ws.prepare(d['id']);card=d['cards'][0];face=card['faces'][0]",
            "    assert face['compiled']['group']=='legendary' and face['compiled']['name']=='Urza, Lord Protector'",
            "    assert card.get('meldBackAsset') and s.asset(card['meldBackAsset'])",
            "    comp=face['compiled'];render=io.BytesIO();Image.new('RGB',(comp['data']['width'],comp['data']['height']),'#334455').save(render,'PNG');ws.save_render(comp['renderKey'],render.getvalue(),(comp['data']['width'],comp['data']['height']))",
            "    plan=Orders(ws).plan([d['id']]);assert plan['cards'][0]['backAsset']==card['meldBackAsset']",
            "    assert 'https://cards.scryfall.io/result.png' in calls",
            '',
          ]
          test='\n'.join(lines)+'\n'
          tests.write_text(text.replace(marker,test+marker,1),encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -r ProxyFoundry/requirements-dev.txt

      - name: Verify Card Tools and meld regression
        run: |
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q tests/test_pipeline.py

      - name: Commit meld support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/foundry/sources.py ProxyFoundry/foundry/domain.py ProxyFoundry/foundry/workspace.py ProxyFoundry/foundry/orders.py ProxyFoundry/site/deck.js ProxyFoundry/tests/test_pipeline.py
          git commit -m 'Support meld result backs'
          git push origin HEAD:main
