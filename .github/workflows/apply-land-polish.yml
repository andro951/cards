name: Apply Derevi land polish

on:
  push:
    paths:
      - '.apply-land-polish'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply land polish
        run: python derevi/apply_land_polish.py
      - name: Commit land polish
        run: |
          rm -f .apply-land-polish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer derevi/STYLE_RULES.md .apply-land-polish
          git commit -m "Polish Derevi land frames and text"
          git push
