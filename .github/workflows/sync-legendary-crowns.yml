name: Sync legendary crowns

on:
  push:
    paths:
      - '.sync-legendary-crowns'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync crowns
        run: python derevi/sync_legendary_crowns.py
      - name: Commit crown sync
        run: |
          rm -f .sync-legendary-crowns
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer derevi/STYLE_RULES.md derevi/PROXY_SYNC_STATUS.md .sync-legendary-crowns
          git commit -m "Sync Derevi legendary crowns"
          git push
