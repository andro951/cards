name: Temporary symbol integrity
on:
  push:
    paths:
      - '.github/workflows/temp-symbol-integrity.yml'
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProxyFoundry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ProxyFoundry/requirements.txt
      - name: Diagnose bundled symbol decoders
        working-directory: ProxyFoundry
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from foundry.images import decode_image
          for p in sorted(Path('assets/symbols').glob('*')):
              if not p.is_file(): continue
              raw=p.read_bytes()
              try:
                  im=decode_image(raw)
                  print('OK',p.name,len(raw),sha256(raw).hexdigest(),im.size)
              except Exception as exc:
                  print('BAD',p.name,len(raw),sha256(raw).hexdigest(),repr(exc))
          PY
