name: Temporary symbol integrity
on:
  push:
    paths:
      - '.github/workflows/temp-symbol-integrity.yml'
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProxyFoundry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ProxyFoundry/requirements-dev.txt
      - name: Verify bundled defaults and override behavior
        working-directory: ProxyFoundry
        run: |
          python -m pytest -q tests/test_default_symbols.py tests/test_github_setup.py tests/test_backs.py
