name: Temporary symbol integrity
on:
  push:
    paths:
      - '.github/workflows/temp-symbol-integrity.yml'
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ProxyFoundry/requirements.txt
      - name: Compare repository symbol sets
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from PIL import Image
          targets={
            'common':'8adb40e8f86e5835f2dbe685413324c035b67b1b2f1948999d216c56d11f4e0c',
            'uncommon':'d04114ee43e6aef807702fa574881c71a37e41da03f7e9e94d35d1bd4cd52e0c',
            'rare':'1a89f7f5c4c2e45db84cc4c498b4fa047542eaeb260f952ededbd6cde71b3a5e',
            'mythic':'3116628c6fba5f59dade0812b508f3d571d21d8c579c6fc076ed3e3caa735236',
          }
          for p in sorted(Path('.').glob('*/set_symbol/*')):
              rarity=p.stem.lower()
              if rarity not in targets or not p.is_file(): continue
              try:
                  with Image.open(p) as source:
                      im=source.convert('RGBA').resize((64,64),Image.Resampling.LANCZOS)
                  h=sha256(im.tobytes()).hexdigest()
                  print('CANDIDATE',p,source.size,h,'MATCH' if h==targets[rarity] else '')
              except Exception as exc:
                  print('ERROR',p,repr(exc))
          PY
