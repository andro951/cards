name: Fix template cache compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-template-cache-compat-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: ProxyFoundry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve legacy generation-version detection
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:raise SystemExit(f'missing expected text in {path}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace('ProxyFoundry/foundry/compiler.py',
              "'pipelineVersion':PIPELINE_VERSION,'generationVersion':GENERATION_VERSION,",
              "'generationVersion':PIPELINE_VERSION,")
          replace('ProxyFoundry/foundry/workspace.py',
              "                    pipeline=comp.get('pipelineVersion',comp.get('generationVersion'))\n                    if pipeline!=PIPELINE_VERSION:\n",
              "                    if comp.get('generationVersion')!=PIPELINE_VERSION:\n")
          PY
      - name: Test compatibility and scoped versions
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q tests/test_v54_integration.py tests/test_template_versions.py tests/test_domain.py tests/test_app_rules.py
      - name: Commit compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/foundry/compiler.py ProxyFoundry/foundry/workspace.py
          git commit -m 'Preserve legacy pipeline cache detection'
          git push origin HEAD:main
