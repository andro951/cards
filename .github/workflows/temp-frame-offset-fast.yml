name: Temporary fast frame offset verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-frame-offset-fast.yml'

permissions:
  contents: write

jobs:
  fix-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply measured corrections
        run: python .github/scripts/temp_frame_offset_fix.py
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verify preserved vendor
        run: python ProxyFoundry/scripts/verify_vendor.py
      - name: Targeted regression tests
        working-directory: ProxyFoundry
        env:
          PF_BROWSER: '1'
        run: python -m pytest -q tests/test_set_symbol_frame_offsets.py tests/test_v54_integration.py tests/test_browser.py::test_browser_import_setup_edit_template_and_mobile
      - name: Render five corrected cards using actual app and native CardConjurer
        env:
          PF_BROWSER: '1'
          PF_LIVE_CC: '1'
        run: python .github/scripts/temp_frame_symbol_render_v2.py
      - name: Upload corrected five-card ZIP
        uses: actions/upload-artifact@v4
        with:
          name: black-square-frame-tests-corrected-fast
          path: ProxyFoundry/test-results/frame-symbol-render-v2/black-square-frame-tests-corrected.zip
          retention-days: 7
          if-no-files-found: error
      - name: Upload corrected manifest
        uses: actions/upload-artifact@v4
        with:
          name: black-square-frame-test-manifest-corrected-fast
          path: ProxyFoundry/test-results/frame-symbol-render-v2/manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/foundry/domain.py ProxyFoundry/foundry/compiler.py ProxyFoundry/tests/test_set_symbol_frame_offsets.py ProxyFoundry/tests/test_v54_integration.py ProxyFoundry/tests/test_browser.py
          git diff --cached --check
          git commit -m 'Center set symbols in land frame families'
          git push origin HEAD:main
