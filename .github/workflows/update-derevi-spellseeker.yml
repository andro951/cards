name: Update Derevi Spellseeker

on:
  push:
    paths:
      - '.update-spellseeker'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hosted Card Conjurer save
        run: python derevi/update_spellseeker.py
      - name: Commit update
        run: |
          rm -f .update-spellseeker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer derevi/STYLE_RULES.md .update-spellseeker
          git commit -m "Add Spellseeker proxy card"
          git push
