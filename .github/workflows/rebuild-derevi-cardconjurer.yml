name: Rebuild Derevi Card Conjurer source

on:
  push:
    paths:
      - '.cc_build_trigger'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Card Conjurer file
        run: |
          cat .cc_parts/part* > /tmp/derevi_cards.b64
          base64 -d /tmp/derevi_cards.b64 > derevi/derevi_cards.cardconjurer
          python -m json.tool derevi/derevi_cards.cardconjurer > /dev/null
      - name: Commit source and remove bootstrap files
        run: |
          rm -rf .cc_parts .cc_build_trigger .github/workflows/rebuild-derevi-cardconjurer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Host Derevi Card Conjurer source"
          git push
