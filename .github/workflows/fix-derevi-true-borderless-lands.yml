name: Fix Derevi true borderless lands

on:
  push:
    paths:
      - '.github/workflows/fix-derevi-true-borderless-lands.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Card Conjurer land data
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path('derevi/derevi_cards.cardconjurer')
          cards = json.loads(path.read_text(encoding='utf-8'))
          before = copy.deepcopy(cards)
          targets = {"Gaea's Cradle", 'Savannah', 'Tropical Island', 'Tundra'}
          found = {entry['key'] for entry in cards if entry.get('key') in targets}
          if found != targets:
              raise SystemExit(f'Missing target cards: {sorted(targets - found)}')

          names = {'W':'White','U':'Blue','B':'Black','R':'Red','G':'Green','M':'Multicolored','A':'Artifact','L':'Land','C':'Colorless'}

          mask_paths = {
              'Pinline':'/img/frames/m15/genericShowcase/m15GenericShowcaseMaskPinline.png',
              'Title':'/img/frames/m15/regular/m15MaskTitle.png',
              'Type':'/img/frames/m15/regular/m15MaskType.png',
              'Rules':'/img/frames/m15/regular/m15MaskRules.png',
              'Border':'/img/frames/m15/regular/m15MaskBorder.png',
          }

          def borderless_frame(letter, mask, right=False):
              masks = [{'src': mask_paths[mask], 'name': mask}]
              if right:
                  masks.append({'src':'/img/frames/maskRightHalf.png','name':'Right Half'})
              return {
                  'name': names[letter] + ' Frame',
                  'src': f'/img/frames/m15/borderless/m15GenericShowcaseFrame{letter}.png',
                  'masks': masks,
              }

          def dual_frames(left, right):
              return [
                  borderless_frame(right, 'Pinline', True),
                  borderless_frame(left, 'Pinline'),
                  borderless_frame('L', 'Title'),
                  borderless_frame(right, 'Type', True),
                  borderless_frame(left, 'Type'),
                  borderless_frame(right, 'Rules', True),
                  borderless_frame(left, 'Rules'),
                  borderless_frame('L', 'Border'),
              ]

          def legendary_land_frames():
              return [
                  {
                      'name':'Land Legend Crown',
                      'src':'/img/frames/m15/crowns/new/l.png',
                      'masks':[],
                      'bounds':{'x':44/2010,'y':53/2814,'width':1922/2010,'height':493/2814},
                  },
                  {
                      'name':'Legend Crown Border Cover',
                      'src':'/img/black.png',
                      'masks':[],
                      'bounds':{'x':0,'y':0,'width':1,'height':137/2814},
                  },
                  borderless_frame('G','Pinline'),
                  borderless_frame('L','Title'),
                  borderless_frame('G','Type'),
                  borderless_frame('G','Rules'),
                  borderless_frame('L','Border'),
              ]

          def apply_true_borderless_layout(card):
              # This is Card Conjurer's actual Borderless frame version, not its Full Art version.
              card['version'] = 'borderless'
              card['artBounds'] = {'x':0,'y':0,'width':1,'height':0.9224}
              # Auto-fit a 1024x1536 (2:3) portrait into those bounds.
              card['artZoom'] = 2010/1024
              card['artX'] = 0
              card['artY'] = -0.0745142857142857
              card['artRotate'] = '0'
              card['setSymbolBounds'] = {'x':0.9213,'y':0.5910,'width':0.12,'height':0.0410,'vertical':'center','horizontal':'right'}
              # Match Card Conjurer's Borderless text geometry.
              card['text']['mana'].update({'y':0.0613,'width':0.9292,'height':71/2100,'size':71/1638,'align':'right'})
              card['text']['title'].update({'x':0.0854,'y':0.0522,'width':0.8292,'height':0.0543,'size':0.0381,'color':'white'})
              card['text']['type'].update({'x':0.0854,'y':0.5664,'width':0.8292,'height':0.0543,'size':0.0324,'color':'white'})
              card['text']['rules'].update({'x':0.086,'y':0.6303,'width':0.828,'height':0.2875,'size':0.0362,'color':'white'})

          by_key = {entry['key']: entry['data'] for entry in cards}

          for key, left, right, reminder in [
              ('Savannah','G','W','{i}({T}: Add {G} or {W}.){/i}'),
              ('Tropical Island','G','U','{i}({T}: Add {G} or {U}.){/i}'),
              ('Tundra','W','U','{i}({T}: Add {W} or {U}.){/i}'),
          ]:
              card = by_key[key]
              apply_true_borderless_layout(card)
              card['frames'] = dual_frames(left, right)
              rules = card['text']['rules']
              rules['text'] = reminder
              rules['align'] = 'center'
              rules.pop('noVerticalCenter', None)

          cradle = by_key["Gaea's Cradle"]
          apply_true_borderless_layout(cradle)
          cradle['frames'] = legendary_land_frames()
          cradle['text']['rules']['align'] = 'left'

          if len(cards) != len(before):
              raise SystemExit('Card count changed unexpectedly')
          for old, new in zip(before, cards):
              if old['key'] not in targets and old != new:
                  raise SystemExit(f"Unexpected change to {old['key']}")

          path.write_text(json.dumps(cards, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('Patched:', ', '.join(sorted(targets)))
          PY
      - name: Validate and commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cards = json.loads(Path('derevi/derevi_cards.cardconjurer').read_text(encoding='utf-8'))
          by_key = {c['key']: c['data'] for c in cards}
          assert len(cards) == 26
          for key in ("Gaea's Cradle", 'Savannah', 'Tropical Island', 'Tundra'):
              c = by_key[key]
              assert c['version'] == 'borderless'
              assert c['artBounds'] == {'x':0,'y':0,'width':1,'height':0.9224}
              assert abs(c['artZoom'] - 1.962890625) < 1e-12
              assert c['artX'] == 0
              assert abs(c['artY'] + 0.0745142857142857) < 1e-12
          for key in ('Savannah','Tropical Island','Tundra'):
              c = by_key[key]
              srcs = [f['src'] for f in c['frames']]
              assert len(srcs) == 8
              assert all('/m15/borderless/' in s for s in srcs)
              assert srcs[-1].endswith('m15GenericShowcaseFrameL.png')
              assert c['text']['rules']['align'] == 'center'
              assert 'noVerticalCenter' not in c['text']['rules']
              assert c['text']['title']['color'] == 'white'
              assert c['text']['type']['color'] == 'white'
          assert by_key["Gaea's Cradle"]['frames'][0]['src'].endswith('/crowns/new/l.png')
          print('Validation passed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Use true borderless layout for Derevi lands [skip ci]"
          git push
