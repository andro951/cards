name: Update Derevi batch cards

on:
  push:
    paths:
      - '.update-derevi-batch'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hosted Card Conjurer save
        run: python derevi/update_batch_cards.py
      - name: Commit update and clean bootstrap files
        run: |
          rm -f .update-derevi-batch derevi/update_batch_cards.py .github/workflows/update-derevi-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add new Derevi proxy cards"
          git push
