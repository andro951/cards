name: Run corrected global set symbol fit patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-global-set-symbol-fit-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply corrected global set symbol fit
        run: python .github/scripts/temp_global_set_symbol_fit.py
      - name: Verify Python syntax
        run: python -m py_compile ProxyFoundry/foundry/compiler.py ProxyFoundry/foundry/domain.py ProxyFoundry/tests/test_v54_integration.py ProxyFoundry/tests/test_v58_station.py
      - name: Test full Bulk Proxy Forge suite
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/foundry/domain.py ProxyFoundry/foundry/compiler.py ProxyFoundry/tests/test_v54_integration.py ProxyFoundry/tests/test_v58_station.py
          git commit -m 'Apply set symbol fit to all generated card frames'
          git push origin HEAD:main
