name: Verify native M15 symbol render

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-verify-m15-symbol-render.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProxyFoundry
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Render exact-dimension symbol through native CardConjurer
        working-directory: ProxyFoundry
        env:
          PF_BROWSER: '1'
          PF_LIVE_CC: '1'
        run: |
          cat > tests/_temp_symbol_render.py <<'PY'
          import io,json,threading
          from PIL import Image
          from foundry.server import App,LocalServer
          from foundry.storage import Store
          from foundry.network import Network
          from foundry.images import ingest_image

          def png(size,color):
              b=io.BytesIO();Image.new('RGBA',size,color).save(b,'PNG');return b.getvalue()

          def test_exact_symbol_native_render(tmp_path):
              from playwright.sync_api import sync_playwright
              s=Store(tmp_path/'workspace');net=Network(s);fallback=net._transport
              ident='11111111-1111-4111-8111-111111111111'
              record={
                  'object':'card','id':ident,'oracle_id':'22222222-2222-4222-8222-222222222222',
                  'name':'Sol Ring','layout':'normal','rarity':'mythic','set':'tst','collector_number':'1',
                  'artist':'Fixture Artist','colors':[],'mana_cost':'{1}','oracle_text':'{T}: Add {C}{C}.',
                  'type_line':'Artifact','image_uris':{'art_crop':'https://cards.scryfall.io/art_crop/front/a/b/fixture.jpg'}
              }
              art=png((1200,1600),(40,70,110,255))
              symbol=png((869,1057),(255,0,255,255))
              def remote(url):
                  if 'api.scryfall.com/cards/' in url:return json.dumps(record).encode(),'application/json',{}
                  if 'cards.scryfall.io' in url:return art,'image/png',{}
                  return fallback(url)
              net.transport=remote;app=App(s,net);server=LocalServer(app)
              threading.Thread(target=server.serve_forever,daemon=True).start()
              sym=ingest_image(s,symbol);back=ingest_image(s,art)
              settings={'symbols':{r:sym['id'] for r in ['common','uncommon','rare','mythic']},'backAsset':back['id']}
              d=app.ws.create({'name':'Symbol diagnostic','source':[{'id':ident}],'settings':settings})
              d=app.ws.prepare(d['id']);comp=d['cards'][0]['faces'][0]['compiled'];data=comp['data']
              print('COMPILED',json.dumps({k:data[k] for k in ['version','setSymbolZoom','setSymbolX','setSymbolY','setSymbolBounds']},sort_keys=True))
              assert data['version']=='m15Regular'
              assert data['setSymbolZoom']==0.109
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True);page=browser.new_page(viewport={'width':1200,'height':900})
                  try:
                      page.goto(server.origin+'/#deck/'+d['id']);page.locator('#generate-deck').wait_for()
                      page.click('#generate-deck');page.locator('.badge.ready,.toast.error').first.wait_for(timeout=480000)
                      ready=app.ws.deck(d['id']);assert ready['status']=='ready',page.locator('#activity-log').text_content()
                      saved=s.render_get(comp['renderKey']);im=Image.open(s.asset_path(saved['asset_id'])).convert('RGB')
                      pix=im.load();xs=[];ys=[]
                      for y in range(im.height):
                          for x in range(im.width):
                              r,g,b=pix[x,y]
                              if r>=250 and g<=5 and b>=250:xs.append(x);ys.append(y)
                      assert xs and ys
                      bbox=(min(xs),min(ys),max(xs)+1,max(ys)+1)
                      print('MAGENTA_BBOX',bbox,'SIZE',(bbox[2]-bbox[0],bbox[3]-bbox[1]))
                      assert 94 <= bbox[2]-bbox[0] <= 96
                      assert 114 <= bbox[3]-bbox[1] <= 116
                  finally:
                      browser.close();server.shutdown();server.server_close();app.close()
          PY
          python -m pytest -q tests/_temp_symbol_render.py -s
