name: Run set symbol diagnostics patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-symbol-runtime-diagnostics-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply diagnostics
        run: python .github/scripts/temp_symbol_diagnostics.py
      - name: Verify JavaScript syntax
        run: |
          node --check ProxyFoundry/site/runtime-bridge.js
          node --check ProxyFoundry/site/render.js
      - name: Test full Bulk Proxy Forge suite
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/foundry/server.py ProxyFoundry/site/runtime-bridge.js ProxyFoundry/site/render.js ProxyFoundry/tests/test_server.py
          git commit -m 'Trace set symbol clipping and native draw geometry'
          git push origin HEAD:main
