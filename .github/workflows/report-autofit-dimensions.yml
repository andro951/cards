name: Report autofit dimensions
on:
  push:
    paths:
      - '.report-autofit-dimensions'
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python derevi/report_autofit_dimensions.py
      - run: |
          rm -f .report-autofit-dimensions
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/AUTOFIT_DIMENSIONS.json .report-autofit-dimensions
          git commit -m "Report autofit image dimensions"
          git push
