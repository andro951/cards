name: Tune Derevi dual land overlays

on:
  push:
    paths:
      - '.github/workflows/tune-derevi-dual-land-overlays.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tune title type and rules overlays
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path('derevi/derevi_cards.cardconjurer')
          cards = json.loads(path.read_text(encoding='utf-8'))
          before = copy.deepcopy(cards)
          targets = {'Savannah', 'Tropical Island', 'Tundra'}
          by_key = {entry['key']: entry['data'] for entry in cards}
          missing = targets - set(by_key)
          if missing:
              raise SystemExit(f'Missing target cards: {sorted(missing)}')

          frame_src = {
              'W':'/img/frames/m15/borderless/m15GenericShowcaseFrameW.png',
              'U':'/img/frames/m15/borderless/m15GenericShowcaseFrameU.png',
              'B':'/img/frames/m15/borderless/m15GenericShowcaseFrameB.png',
              'R':'/img/frames/m15/borderless/m15GenericShowcaseFrameR.png',
              'G':'/img/frames/m15/borderless/m15GenericShowcaseFrameG.png',
              'L':'/img/frames/m15/borderless/m15GenericShowcaseFrameL.png',
          }
          frame_name = {'W':'White','U':'Blue','B':'Black','R':'Red','G':'Green','L':'Land'}
          mask_src = {
              'Pinline':'/img/frames/m15/genericShowcase/m15GenericShowcaseMaskPinline.png',
              'Title':'/img/frames/m15/regular/m15MaskTitle.png',
              'Type':'/img/frames/m15/regular/m15MaskType.png',
              'Rules':'/img/frames/m15/regular/m15MaskRules.png',
              'Border':'/img/frames/m15/regular/m15MaskBorder.png',
          }

          def layer(letter, mask, right=False, *, opacity=None, overlay=None):
              masks = [{'src': mask_src[mask], 'name': mask}]
              if right:
                  masks.append({'src':'/img/frames/maskRightHalf.png','name':'Right Half'})
              out = {
                  'name': f"{frame_name[letter]} Frame",
                  'src': frame_src[letter],
                  'masks': masks,
              }
              if opacity is not None:
                  out['opacity'] = opacity
              if overlay is not None:
                  out['colorOverlayCheck'] = True
                  out['colorOverlay'] = overlay
              return out

          # RVR-inspired treatment:
          # - colored pinlines remain crisp
          # - title/type boxes are neutral, darker, and translucent
          # - rules box is a darker translucent split between the two land colors
          def dual_frames(left, right):
              color_overlay = {
                  'W':'#6F6A59',
                  'U':'#075C88',
                  'B':'#201B24',
                  'R':'#7A2F23',
                  'G':'#174A31',
              }
              return [
                  layer(right, 'Pinline', True),
                  layer(left, 'Pinline'),
                  layer('L', 'Title', opacity=48, overlay='#20252B'),
                  layer('L', 'Type', opacity=52, overlay='#20252B'),
                  layer(right, 'Rules', True, opacity=76, overlay=color_overlay[right]),
                  layer(left, 'Rules', opacity=76, overlay=color_overlay[left]),
                  layer('L', 'Border'),
              ]

          for key, left, right in [
              ('Savannah','G','W'),
              ('Tropical Island','G','U'),
              ('Tundra','W','U'),
          ]:
              card = by_key[key]
              if card.get('version') != 'borderless':
                  raise SystemExit(f'{key} is not using the true borderless profile')
              card['frames'] = dual_frames(left, right)
              rules = card['text']['rules']
              rules['align'] = 'center'
              rules.pop('noVerticalCenter', None)

          if len(cards) != len(before):
              raise SystemExit('Card count changed unexpectedly')
          for old, new in zip(before, cards):
              if old['key'] not in targets and old != new:
                  raise SystemExit(f"Unexpected change to {old['key']}")

          path.write_text(json.dumps(cards, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cards = json.loads(Path('derevi/derevi_cards.cardconjurer').read_text(encoding='utf-8'))
          by_key = {c['key']: c['data'] for c in cards}
          for key in ('Savannah','Tropical Island','Tundra'):
              c = by_key[key]
              assert c['version'] == 'borderless'
              assert len(c['frames']) == 7
              title = c['frames'][2]
              typ = c['frames'][3]
              rright = c['frames'][4]
              rleft = c['frames'][5]
              assert title['colorOverlay'] == '#20252B' and title['opacity'] == 48
              assert typ['colorOverlay'] == '#20252B' and typ['opacity'] == 52
              assert rright['opacity'] == 76 and rleft['opacity'] == 76
              assert rright['colorOverlayCheck'] and rleft['colorOverlayCheck']
              assert c['text']['rules']['align'] == 'center'
              assert 'noVerticalCenter' not in c['text']['rules']
          print('Validation passed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Tune borderless dual-land overlays [skip ci]"
          git push
