name: Temporary apply card data updates

on:
  push:
    paths:
      - '.github/scripts/temp_apply_card_updates.py'
      - '.github/scripts/temp_append_style_rules.py'
      - '.github/workflows/temp-apply-card-updates.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply and validate card updates
        run: python .github/scripts/temp_apply_card_updates.py
      - name: Apply style-rule updates
        run: python .github/scripts/temp_append_style_rules.py
      - name: Commit generated project files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doctor_who/doctor_who_cards.cardconjurer derevi/derevi_cards.cardconjurer STYLE_RULES.md doctor_who/STYLE_RULES.md derevi/STYLE_RULES.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Document Doctor Who and borderless land card rules'
            git push origin main
          fi
