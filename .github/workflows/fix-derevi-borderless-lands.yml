name: Fix Derevi borderless lands

on:
  push:
    paths:
      - '.github/workflows/fix-derevi-borderless-lands.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Card Conjurer land data
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path('derevi/derevi_cards.cardconjurer')
          cards = json.loads(path.read_text(encoding='utf-8'))
          before = copy.deepcopy(cards)
          targets = {"Gaea's Cradle", 'Savannah', 'Tropical Island', 'Tundra'}
          found = {entry['key'] for entry in cards if entry.get('key') in targets}
          if found != targets:
              raise SystemExit(f'Missing target cards: {sorted(targets - found)}')

          names = {
              'W':'White','U':'Blue','B':'Black','R':'Red','G':'Green','M':'Multicolored',
              'A':'Artifact','L':'Land','C':'Colorless','V':'Vehicle',
              'WL':'White Land','UL':'Blue Land','BL':'Black Land','RL':'Red Land','GL':'Green Land','ML':'Multicolored Land'
          }
          assets = {
              'W':'w','U':'u','B':'b','R':'r','G':'g','M':'m','A':'a','L':'l','C':'c','V':'v',
              'WL':'lw','UL':'lu','BL':'lb','RL':'lr','GL':'lg','ML':'lm'
          }

          def fullart_frame(letter, mask, right=False):
              masks = [{'src': f'/img/frames/m15/new/{mask.lower()}.png', 'name': mask}]
              if right:
                  masks.append({'src':'/img/frames/maskRightHalf.png','name':'Right Half'})
              return {
                  'name': names[letter] + ' Frame',
                  'src': f"/img/frames/m15/new/fullart/{assets[letter]}.png",
                  'masks': masks,
              }

          def borderless_dual_land_frames(left, right):
              return [
                  fullart_frame(right + 'L', 'Pinline', True),
                  fullart_frame(left + 'L', 'Pinline'),
                  fullart_frame('L', 'Title'),
                  fullart_frame(right + 'L', 'Type', True),
                  fullart_frame(left + 'L', 'Type'),
                  fullart_frame(right + 'L', 'Rules', True),
                  fullart_frame(left + 'L', 'Rules'),
              ]

          def borderless_legendary_land_frames(color='GL'):
              return [
                  {
                      'name':'Land Legend Crown',
                      'src':'/img/frames/m15/crowns/new/l.png',
                      'masks':[],
                      'bounds':{'x':44/2010,'y':53/2814,'width':1922/2010,'height':493/2814},
                  },
                  {
                      'name':'Legend Crown Border Cover',
                      'src':'/img/black.png',
                      'masks':[],
                      'bounds':{'x':0,'y':0,'width':1,'height':137/2814},
                  },
                  fullart_frame(color, 'Pinline'),
                  fullart_frame('L', 'Title'),
                  fullart_frame(color, 'Type'),
                  fullart_frame(color, 'Rules'),
              ]

          def apply_borderless_layout(card):
              card['version'] = 'm15ClearTextboxes'
              card['artBounds'] = {'x':0.062,'y':0.1129,'width':0.876,'height':0.8096}
              card['setSymbolBounds'] = {'x':1862/2010,'y':0.5910,'width':0.12,'height':0.0410,'vertical':'center','horizontal':'right'}
              card['artX'] = 125/2010
              card['artY'] = 137/2814
              card['artZoom'] = 1.719
              card['artRotate'] = '0'
              card['text']['mana'].update({'y':176/2814,'width':1864/2010,'height':71/2100,'size':70.5/1638})
              card['text']['title'].update({'x':168/2010,'y':145/2814,'width':0.8292,'height':0.0543,'size':0.0381})
              card['text']['type'].update({'x':168/2010,'y':1588/2814,'width':0.8292,'height':0.0543,'size':0.0324,'color':'white'})
              card['text']['rules'].update({'x':0.086,'y':1780/2814,'width':0.828,'height':0.2875,'size':0.0362,'color':'white'})
              card['text']['rules'].pop('noVerticalCenter', None)

          by_key = {entry['key']: entry['data'] for entry in cards}

          cradle = by_key["Gaea's Cradle"]
          apply_borderless_layout(cradle)
          cradle['frames'] = borderless_legendary_land_frames('GL')
          cradle['text']['rules']['align'] = 'left'

          for key, left, right, reminder in [
              ('Savannah','G','W','{i}({T}: Add {G} or {W}.){/i}'),
              ('Tropical Island','G','U','{i}({T}: Add {G} or {U}.){/i}'),
              ('Tundra','W','U','{i}({T}: Add {W} or {U}.){/i}'),
          ]:
              card = by_key[key]
              apply_borderless_layout(card)
              card['frames'] = borderless_dual_land_frames(left, right)
              rules = card['text']['rules']
              rules['text'] = reminder
              rules['align'] = 'center'
              rules.pop('noVerticalCenter', None)

          if len(cards) != len(before):
              raise SystemExit('Card count changed unexpectedly')
          for old, new in zip(before, cards):
              if old['key'] not in targets and old != new:
                  raise SystemExit(f"Unexpected change to {old['key']}")

          path.write_text(json.dumps(cards, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('Patched:', ', '.join(sorted(targets)))
          PY
      - name: Validate and commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('derevi/derevi_cards.cardconjurer')
          cards = json.loads(p.read_text(encoding='utf-8'))
          by_key = {c['key']: c['data'] for c in cards}
          assert len(cards) == 26
          for key in ("Gaea's Cradle", 'Savannah', 'Tropical Island', 'Tundra'):
              c = by_key[key]
              assert c['version'] == 'm15ClearTextboxes'
              assert c['artBounds'] == {'x':0.062,'y':0.1129,'width':0.876,'height':0.8096}
          for key in ('Savannah','Tropical Island','Tundra'):
              srcs = [f['src'] for f in by_key[key]['frames']]
              assert len(srcs) == 7
              assert srcs[0].startswith('/img/frames/m15/new/fullart/l')
              assert srcs[1].startswith('/img/frames/m15/new/fullart/l')
              assert srcs[2].endswith('/fullart/l.png')
              assert all('/fullart/' in s for s in srcs)
              assert by_key[key]['text']['rules']['align'] == 'center'
              assert 'noVerticalCenter' not in by_key[key]['text']['rules']
          cradle = by_key["Gaea's Cradle"]
          srcs = [f['src'] for f in cradle['frames']]
          assert srcs[0].endswith('/crowns/new/l.png')
          assert srcs[1] == '/img/black.png'
          print('Validation passed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Use borderless-style full-art frames for Derevi lands [skip ci]"
          git push
