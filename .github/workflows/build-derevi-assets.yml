name: Build Derevi assets

on:
  push:
    paths:
      - '.build-derevi-assets'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct asset archive
        run: |
          cat .asset_chunks/chunk-* > /tmp/derevi-assets.b64
          base64 -d /tmp/derevi-assets.b64 > /tmp/derevi-assets.zip
          mkdir -p derevi
          unzip -o /tmp/derevi-assets.zip -d derevi
      - name: Commit assets and cleanup bootstrap files
        run: |
          rm -rf .asset_chunks .build-derevi-assets .github/workflows/build-derevi-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Derevi proxy assets"
          git push
