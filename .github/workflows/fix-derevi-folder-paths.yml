name: Fix Derevi folder paths

on:
  push:
    paths:
      - '.github/workflows/fix-derevi-folder-paths.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Card Conjurer asset URLs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('derevi/derevi_cards.cardconjurer')
          cards = json.loads(path.read_text(encoding='utf-8'))
          base = 'https://raw.githubusercontent.com/andro951/cards/main/derevi/'
          art_base = base + 'art/'
          symbol_base = base + 'set_symbol/'
          symbol_names = {'mythic.png', 'rare.png', 'uncommon.png', 'common.png'}

          art_updates = 0
          symbol_updates = 0
          for entry in cards:
              data = entry.get('data', {})
              art = data.get('artSource')
              if isinstance(art, str) and art.startswith(base) and not art.startswith(art_base):
                  tail = art[len(base):]
                  if '/' not in tail and tail.lower().endswith('.png'):
                      data['artSource'] = art_base + tail
                      art_updates += 1

              symbol = data.get('setSymbolSource')
              if isinstance(symbol, str) and symbol.startswith(base) and not symbol.startswith(symbol_base):
                  tail = symbol[len(base):]
                  if tail in symbol_names:
                      data['setSymbolSource'] = symbol_base + tail
                      symbol_updates += 1

          if not art_updates and not symbol_updates:
              raise SystemExit('No old Derevi asset URLs found to update')

          for entry in cards:
              data = entry.get('data', {})
              art = data.get('artSource')
              if isinstance(art, str) and art.startswith(base):
                  assert art.startswith(art_base), (entry.get('key'), art)
              symbol = data.get('setSymbolSource')
              if isinstance(symbol, str) and symbol.startswith(base):
                  assert symbol.startswith(symbol_base), (entry.get('key'), symbol)

          path.write_text(json.dumps(cards, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print(f'Updated {art_updates} art URLs and {symbol_updates} set-symbol URLs')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer
          git commit -m "Update Derevi asset URLs for new folder structure [skip ci]"
          git push
