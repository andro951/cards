name: Temporary fix Esika pair

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/temp_fix_esika_pair.py'
      - '.github/workflows/temp-fix-esika-pair.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix and validate Esika pair
        run: python .github/scripts/temp_fix_esika_pair.py
      - name: Commit fixed card data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doctor_who/doctor_who_cards.cardconjurer doctor_who/STYLE_RULES.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix Esika and Prismatic Bridge layout'
            git push origin HEAD:main
          fi
