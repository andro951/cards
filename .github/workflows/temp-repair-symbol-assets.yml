name: Temporary repair default symbol assets
on:
  push:
    paths:
      - '.github/workflows/temp-repair-symbol-assets.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10.4,<13'
      - name: Reconstruct exact uploaded default symbols
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, urllib.request
          from PIL import Image

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          specs={
              'uncommon':{
                  'suffix':'c1309ce336149157d0b3b2a1fd6729fd769cf94d',
                  'prefix':'f7c63b59b6e59efd4dcfdb87bd83b905c5f882cd',
                  'sha256':'cf2d3bc00d4f280b1819a6b32f6edff8d470717cfb82a740afcc761e1557a40c',
                  'size':16506,'dims':(92,128)},
              'rare':{
                  'suffix':'9723969124abcc6c87c4c88624b52e7765330423',
                  'prefix':'95e5ef99c0d1d34c00d97d6b0316d006664d3d6f',
                  'sha256':'cc554cbc4e32b3f5b86b578f5b3945f3c2871ee1e333933451e9959cf8e96497',
                  'size':18298,'dims':(93,128)},
              'mythic':{
                  'suffix':'257af2a203bb4673ca1ce7ca57b6d88f9d1549c6',
                  'prefix':'0d91f6674d3fc7b7cd12381f7f9fb3c1172d513b',
                  'sha256':'7c8fd85c9009a3918679dd09b3b5355d17ef51b486ce929b569de933d869dfeb',
                  'size':18676,'dims':(93,128)},
          }
          def git_blob_sha(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          def fetch_blob(sha):
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  payload=json.load(response)
              raw=base64.b64decode(payload['content'])
              assert git_blob_sha(raw)==sha,(sha,git_blob_sha(raw))
              return raw

          root=Path('ProxyFoundry/assets/symbols')
          common=root/'common.webp'
          common_raw=common.read_bytes()
          assert len(common_raw)==14592
          assert hashlib.sha256(common_raw).hexdigest()=='edf28920933fae71a7a8a3c404bb3ded697412126b07d9f3a45a56a6a1973f87'
          with Image.open(common) as im:
              im.load();assert im.size==(92,128)

          for rarity,spec in specs.items():
              path=root/(rarity+'.webp')
              current=path.read_bytes()
              prefix=current[:7500]
              assert len(prefix)==7500
              assert git_blob_sha(prefix)==spec['prefix'],(rarity,git_blob_sha(prefix))
              raw=prefix+fetch_blob(spec['suffix'])
              assert len(raw)==spec['size'],(rarity,len(raw))
              assert hashlib.sha256(raw).hexdigest()==spec['sha256'],rarity
              path.write_bytes(raw)
              with Image.open(path) as im:
                  im.load();assert im.size==spec['dims'];assert im.format=='WEBP'
              print(rarity,len(raw),spec['sha256'])
          PY
      - name: Commit repaired binary assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProxyFoundry/assets/symbols/*.webp
          git diff --cached --exit-code && { echo "No repairs staged"; exit 1; } || true
          git commit -m "Repair exact bundled default symbol files"
          git push
