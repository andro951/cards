name: Apply live GitHub artwork policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-always-refresh-github-art.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: ProxyFoundry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch GitHub artwork freshness
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:160]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          setup='ProxyFoundry/site/setup.js'
          replace(setup,
              "      <label class=\"check-line\"><input type=\"checkbox\" id=\"refresh-custom-art\" ${s.source.refreshArt?'checked':''}><span>Refresh custom GitHub art when generating<small>Checks changed filenames and image contents. Scryfall still follows its separate year/week cache setting.</small></span></label>\n",
              "")
          replace(setup,
              "    s.source.githubFolder=$('#github-folder',root).value.trim();s.source.ref=$('#github-ref',root).value.trim();s.source.fallback=$('#art-fallback',root).checked;s.source.refreshArt=$('#refresh-custom-art',root).checked;\n",
              "    s.source.githubFolder=$('#github-folder',root).value.trim();s.source.ref=$('#github-ref',root).value.trim();s.source.fallback=$('#art-fallback',root).checked;\n")

          workspace='ProxyFoundry/foundry/workspace.py'
          replace(workspace,
              "        s={**copy.deepcopy(DEFAULT_SETTINGS),**settings,**self.backs.settings(settings)};s['source']={**DEFAULT_SETTINGS['source'],**s.get('source',{})};s.pop('landLibrary',None)\n",
              "        s={**copy.deepcopy(DEFAULT_SETTINGS),**settings,**self.backs.settings(settings)};s['source']={**DEFAULT_SETTINGS['source'],**s.get('source',{})};s.pop('landLibrary',None);s['source'].pop('refreshArt',None)\n")
          replace(workspace,
              "        refresh=bool(settings.get('refreshData') or self.global_settings().get('refreshData'))\n        # Scryfall alone uses the year/week policy; mutable custom art is rechecked\n        # after ten minutes, or immediately when the user asks to refresh custom art.\n        ttl=None if origin=='Scryfall selected printing' else (0 if settings['source'].get('refreshArt') else 600)\n        raw,_,_=self.net.fetch(url,refresh=refresh,ttl=ttl);asset=ingest_image(self.store,raw)\n",
              "        refresh=bool(settings.get('refreshData') or self.global_settings().get('refreshData'))\n        # GitHub artwork is a live source: every generation rechecks the remote\n        # bytes. Scryfall keeps its separate year/week cache policy.\n        if origin in {'GitHub folder','land art library'}:\n            raw,_,_=self.net.fetch(url,refresh=True,ttl=0)\n        else:\n            raw,_,_=self.net.fetch(url,refresh=refresh,ttl=None)\n        asset=ingest_image(self.store,raw)\n")
          replace(workspace,
              "            progress(0,1,'Reading GitHub artwork folder');index=self.sources.github_index(s['source']['githubFolder'],s['source'].get('ref') or None,refresh=bool(s['source'].get('refreshArt')))\n",
              "            progress(0,1,'Reading GitHub artwork folder');index=self.sources.github_index(s['source']['githubFolder'],s['source'].get('ref') or None,refresh=True)\n")
          replace(workspace,
              "            progress(0,1,'Reading hosted full-art land library');land_index=self.sources.github_index(HOSTED_LAND_LIBRARY)\n",
              "            progress(0,1,'Reading hosted full-art land library');land_index=self.sources.github_index(HOSTED_LAND_LIBRARY,refresh=True)\n")

          sources='ProxyFoundry/foundry/sources.py'
          replace(sources,
              "        if loc['default_ref']:loc['ref']=self.net.json('https://api.github.com/repos/'+loc['repo'],refresh=refresh).get('default_branch','main')\n",
              "        if loc['default_ref']:loc['ref']=self.net.json('https://api.github.com/repos/'+loc['repo'],ttl=0 if refresh else 600).get('default_branch','main')\n")

          readme='ProxyFoundry/README.md'
          replace(readme,
              "Scryfall data/art cache is **365 days**, or **7 days** with Fetch new data enabled. Fresh entries are reused, not fetched on every request. Mutable custom GitHub art is rechecked after ten minutes or immediately with **Refresh custom GitHub art**; that is separate from the Scryfall policy. Pinned CardConjurer dependencies are cached individually.",
              "Scryfall data/art cache is **365 days**, or **7 days** with Fetch new data enabled. Fresh Scryfall entries are reused, not fetched on every request. GitHub folder artwork and the hosted full-art land library are treated as live sources: their folder listings and selected image bytes are re-fetched whenever images are generated. Pinned CardConjurer dependencies are cached individually.")

          Path('ProxyFoundry/tests/test_art_cache.py').write_text('''\"\"\"GitHub art is live; Scryfall keeps its separate year/week cache policy.\"\"\"\nimport io\nfrom PIL import Image\nfrom foundry.storage import Store\nfrom foundry.workspace import Workspace\nfrom foundry.sources import Sources\n\ndef make_workspace(tmp_path):\n    out=io.BytesIO();Image.new('RGB',(600,840),'#7566aa').save(out,'PNG')\n    calls=[]\n    class Network:\n        def fetch(self,url,**kwargs):calls.append((url,kwargs));return out.getvalue(),'image/png',{}\n    ws=Workspace(Store(tmp_path),Network())\n    sf={'name':'One Card','type_line':'Land','image_uris':{'art_crop':'https://cards.scryfall.io/art_crop/front/a/b/test.jpg'}}\n    return ws,sf,calls\n\ndef test_github_art_is_refetched_every_generation(tmp_path):\n    ws,sf,calls=make_workspace(tmp_path)\n    settings=ws.validate_settings({'source':{'mode':'github','githubFolder':'owner/repo/art'}})\n    index={'one_card':'https://raw.githubusercontent.com/owner/repo/main/art/one_card.png'}\n    ws._art(sf,sf,{},settings,index,{})\n    assert calls[-1][1]=={'refresh':True,'ttl':0}\n\ndef test_hosted_land_art_is_refetched_every_generation(tmp_path):\n    ws,sf,calls=make_workspace(tmp_path)\n    settings=ws.validate_settings({'source':{'mode':'scryfall'},'useLandLibrary':True})\n    land_index={'one_card':'https://raw.githubusercontent.com/andro951/cards/main/ProxyFoundry/full_art_lands/one_card.png'}\n    ws._art(sf,sf,{},settings,{},land_index)\n    assert calls[-1][1]=={'refresh':True,'ttl':0}\n\ndef test_old_refresh_art_setting_is_discarded(tmp_path):\n    ws,_,_=make_workspace(tmp_path)\n    settings=ws.validate_settings({'source':{'mode':'github','githubFolder':'owner/repo/art','refreshArt':True}})\n    assert 'refreshArt' not in settings['source']\n\ndef test_github_folder_index_bypasses_cache_when_refreshing():\n    class Network:\n        def __init__(self):self.calls=[]\n        def json(self,url,**kwargs):\n            self.calls.append((url,kwargs))\n            if url=='https://api.github.com/repos/owner/repo':return {'default_branch':'main'}\n            return [{'type':'file','name':'one_card.png','path':'art/one_card.png'}]\n    net=Network();index=Sources(net).github_index('owner/repo/art',refresh=True)\n    assert index['one_card'].endswith('/owner/repo/main/art/one_card.png')\n    assert len(net.calls)==2 and all(kwargs.get('ttl')==0 for _,kwargs in net.calls)\n\ndef test_scryfall_cache_policy_is_unchanged(tmp_path):\n    ws,sf,calls=make_workspace(tmp_path)\n    settings=ws.validate_settings({'source':{'mode':'scryfall'}})\n    ws._art(sf,sf,{},settings,{},{});assert calls[-1][1]=={'refresh':False,'ttl':None}\n    settings['refreshData']=True\n    ws._art(sf,sf,{},settings,{},{});assert calls[-1][1]=={'refresh':True,'ttl':None}\n\ndef test_global_scryfall_refresh_applies_to_art(tmp_path):\n    ws,sf,calls=make_workspace(tmp_path)\n    ws.set_global_settings({'refreshData':True})\n    settings=ws.validate_settings({})\n    ws._art(sf,sf,{},settings,{},{})\n    assert calls[-1][1]=={'refresh':True,'ttl':None}\n''',encoding='utf-8')

          visibility=Path('ProxyFoundry/tests/test_art_source_visibility.py')
          text=visibility.read_text(encoding='utf-8')
          if 'test_github_refresh_toggle_is_removed' not in text:
              text += '''\n\ndef test_github_refresh_toggle_is_removed():\n    source=Path(\"site/setup.js\").read_text(encoding=\"utf-8\")\n    assert 'refresh-custom-art' not in source\n    assert 'refreshArt' not in source\n'''
              visibility.write_text(text,encoding='utf-8')
          PY
      - name: Test live GitHub art behavior
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q tests/test_art_cache.py tests/test_art_source_visibility.py tests/test_hosted_land_library.py tests/test_app_rules.py
      - name: Commit app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/site/setup.js ProxyFoundry/foundry/workspace.py ProxyFoundry/foundry/sources.py ProxyFoundry/README.md ProxyFoundry/tests/test_art_cache.py ProxyFoundry/tests/test_art_source_visibility.py
          git commit -m 'Always refresh GitHub artwork'
          git push origin HEAD:main
