name: Proxy Foundry CI
on:
  push:
    paths:
      - 'ProxyFoundry/**'
      - '.github/workflows/proxy-foundry-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proxy-foundry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProxyFoundry
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Preserve approved Card Tools
        run: python ProxyFoundry/scripts/verify_vendor.py
      - name: Check browser JavaScript syntax
        run: |
          for file in ProxyFoundry/site/*.js; do
            node --check "$file"
          done
      - name: Unit, API, actual browser and actual native renderer tests
        working-directory: ProxyFoundry
        env:
          PF_BROWSER: '1'
          PF_LIVE_CC: '1'
        run: python -m pytest -q --tb=short --junitxml=test-results/unit.xml
      - name: Package source and test evidence (no artwork libraries or font caches)
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('ProxyFoundry')
          with zipfile.ZipFile('ProxyFoundry-checkpoint.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or any(x in {'.venv', '__pycache__', '.pytest_cache', 'workspace', '_work', '.cache', 'node_modules', 'checkpoints'} for x in p.parts):
                      continue
                  if p.suffix.lower() in {'.pyc', '.ttf', '.otf', '.woff', '.woff2', '.pem', '.crx'}:
                      continue
                  out.write(p, p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProxyFoundry-checkpoint
          path: ProxyFoundry-checkpoint.zip
          retention-days: 7
          if-no-files-found: error
