name: Proxy Foundry CI
on:
  push:
    paths:
      - 'ProxyFoundry/**'
      - '.github/workflows/proxy-foundry-ci.yml'
  workflow_dispatch:
    inputs:
      full_sweep:
        description: Run extended browser, live and large stress tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: proxy-foundry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProxyFoundry
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Preserve approved Card Tools
        run: python ProxyFoundry/scripts/verify_vendor.py
      - name: Check browser JavaScript syntax and adapter tests
        working-directory: ProxyFoundry
        run: |
          for file in site/*.js site/*.mjs web/*.js extension/*.js; do node --check "$file"; done
          node --test tests_web/*.test.mjs
      - name: Routine unit and API gate
        working-directory: ProxyFoundry
        run: python -m pytest -q -m routine --tb=short --junitxml=test-results/routine.xml
      - name: Actual static browser production gate
        working-directory: ProxyFoundry
        env:
          PF_BROWSER: '1'
          PF_LIVE_CC: '1'
        run: >-
          python -m pytest -q --tb=short
          'tests/test_website.py::test_static_website_import_frame_review_and_zip[Normal Look-/cards/]'
          tests/test_website.py::test_static_browser_job_progress_cancellation_and_reload
          tests/test_website.py::test_static_engine_releases_image_responses_and_error_diagnostics
          tests/test_browser_storage.py::test_immediate_deletion_order_guard_filter_and_recovery
          --junitxml=test-results/production.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProxyFoundry-routine-evidence
          path: ProxyFoundry/test-results
          retention-days: 7
  extended:
    if: github.event_name == 'workflow_dispatch' && inputs.full_sweep
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProxyFoundry
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Affected and full sweep group
        working-directory: ProxyFoundry
        env:
          PF_BROWSER: '1'
          PF_LIVE_CC: '1'
          PF_DOM: '1'
          PF_LIVE_GITHUB_SETUP: '1'
          PF_LARGE_TRANSFER: '1'
          PF_DECK_STRESS: '1'
          PF_HEAP_BOUNDARY: '1'
          PF_LIVE_DECK_SITES: '1'
        run: |
          browser=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          export PF_BROWSER_EXECUTABLE="$browser" PF_DOM_EXECUTABLE="$browser"
          python -m pytest -q -m extended --tb=short --junitxml=test-results/extended.xml
          node --test tests_web/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProxyFoundry-extended-evidence
          path: ProxyFoundry/test-results
          retention-days: 7
