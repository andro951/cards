name: One-shot filled black square set-symbol render
on:
  push:
    branches: [bpf/one-shot-black-square-symbol]
    paths: ['.github/workflows/temp-one-shot-black-square-symbol-filled.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Render one test card
        env:
          PF_BROWSER: '1'
          PF_LIVE_CC: '1'
        run: |
          python - <<'PY'
          import io,json,shutil,threading,tempfile
          from pathlib import Path
          from PIL import Image,ImageDraw
          from playwright.sync_api import sync_playwright
          import sys
          sys.path.insert(0,'ProxyFoundry')
          from foundry.server import App,LocalServer
          from foundry.storage import Store
          from foundry.network import Network
          from foundry.images import ingest_image
          from foundry.domain import RARITIES

          def png_art():
              im=Image.new('RGB',(1200,1600),'#302a24')
              d=ImageDraw.Draw(im)
              d.rectangle((140,180,1060,1420),fill='#aa7d3b')
              d.ellipse((310,380,890,960),fill='#e4c17a')
              d.ellipse((430,500,770,840),fill='#42311f')
              b=io.BytesIO();im.save(b,'PNG');return b.getvalue()

          def black_square():
              # Existing M15 setSymbolZoom is ~0.101. A 1142 px square therefore
              # renders at ~115.3 px tall, matching setSymbolBounds.height
              # (0.041 * 2814 = 115.37 px) while preserving square aspect ratio.
              b=io.BytesIO();Image.new('RGBA',(1142,1142),(0,0,0,255)).save(b,'PNG');return b.getvalue()

          card={
            'object':'card','id':'11111111-1111-4111-8111-000000000001',
            'oracle_id':'22222222-2222-4222-8222-000000000001',
            'name':'Sol Ring','layout':'normal','rarity':'rare','set':'tst','collector_number':'1',
            'artist':'Test Artist','colors':[],'mana_cost':'{1}','oracle_text':'{T}: Add {C}{C}.',
            'type_line':'Artifact','image_uris':{'art_crop':'https://cards.scryfall.io/art_crop/front/a/b/fixture.jpg'}
          }
          home=Path(tempfile.mkdtemp(prefix='bpf-black-square-filled-'))/'workspace'
          store=Store(home);net=Network(store);transport=net._transport;art=png_art()
          def remote(url):
              if 'api.scryfall.com/cards/' in url:return json.dumps(card).encode(),'application/json',{}
              if 'cards.scryfall.io' in url:return art,'image/png',{}
              return transport(url)
          net.transport=remote
          app=App(store,net);server=LocalServer(app);threading.Thread(target=server.serve_forever,daemon=True).start()
          symbol=ingest_image(store,black_square())
          back=ingest_image(store,art)
          deck=app.ws.create({'name':'Filled black square set-symbol alignment test','source':[{'id':card['id'],'quantity':1}],
            'settings':{'symbols':{r:symbol['id'] for r in RARITIES},'backAsset':back['id'],'artist':'ChatGPT'}})
          deck=app.ws.prepare(deck['id'])
          errors=[f.get('error') for c in deck['cards'] for f in c['faces'] if f.get('error')]
          assert not errors,errors
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000})
              page.goto(server.origin+'/#deck/'+deck['id'])
              page.locator('#generate-deck').wait_for();page.click('#generate-deck')
              page.locator('.badge.ready,.toast.error').first.wait_for(timeout=360000)
              ready=app.ws.deck(deck['id'])
              assert ready['status']=='ready',ready['status']
              comp=ready['cards'][0]['faces'][0]['compiled']
              render=store.render_get(comp['renderKey']);assert render
              out=Path('one-shot-output');out.mkdir(exist_ok=True)
              shutil.copyfile(store.asset_path(render['asset_id']),out/'sol_ring_black_square_set_symbol_filled.png')
              shutil.copyfile(store.asset_path(symbol['id']),out/'black_square_symbol_filled.png')
              (out/'geometry.json').write_text(json.dumps({
                'sourceSize':[symbol['width'],symbol['height']],
                'setSymbolZoom':comp['data'].get('setSymbolZoom'),
                'setSymbolX':comp['data'].get('setSymbolX'),
                'setSymbolY':comp['data'].get('setSymbolY'),
                'setSymbolBounds':comp['data'].get('setSymbolBounds')
              },indent=2))
              browser.close()
          server.shutdown();server.server_close();app.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: black-square-set-symbol-filled-test
          path: one-shot-output/
          if-no-files-found: error
