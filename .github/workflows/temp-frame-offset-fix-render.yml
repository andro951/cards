name: Temporary measured frame offset fix and render

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-frame-offset-fix-render.yml'

permissions:
  contents: write

jobs:
  fix-test-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply measured frame-specific symbol corrections
        run: python .github/scripts/temp_frame_offset_fix.py
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verify approved Card Tools
        run: python ProxyFoundry/scripts/verify_vendor.py
      - name: Syntax checks
        run: |
          python -m py_compile ProxyFoundry/foundry/compiler.py ProxyFoundry/foundry/domain.py ProxyFoundry/tests/test_set_symbol_frame_offsets.py
      - name: Full Bulk Proxy Forge test suite
        working-directory: ProxyFoundry
        env:
          PF_BROWSER: '1'
          PF_LIVE_CC: '1'
        run: python -m pytest -q
      - name: Render five corrected frame tests through native CardConjurer
        env:
          PF_BROWSER: '1'
          PF_LIVE_CC: '1'
        run: python .github/scripts/temp_frame_symbol_render_v2.py
      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/foundry/domain.py ProxyFoundry/foundry/compiler.py ProxyFoundry/tests/test_set_symbol_frame_offsets.py
          git diff --cached --check
          git commit -m 'Center set symbols in land frame families'
          git push origin HEAD:main
      - name: Upload corrected five-card ZIP
        uses: actions/upload-artifact@v4
        with:
          name: black-square-frame-tests-corrected
          path: ProxyFoundry/test-results/frame-symbol-render-v2/black-square-frame-tests-corrected.zip
          retention-days: 7
          if-no-files-found: error
      - name: Upload corrected manifest
        uses: actions/upload-artifact@v4
        with:
          name: black-square-frame-test-manifest-corrected
          path: ProxyFoundry/test-results/frame-symbol-render-v2/manifest.json
          retention-days: 7
          if-no-files-found: error
