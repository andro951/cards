name: Capture Derevi pipeline test data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-capture-derevi-pipeline-test.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            derevi/art
            derevi/set_symbol

      - name: Capture exact Scryfall responses
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time, urllib.error, urllib.parse, urllib.request

          root = pathlib.Path('pipeline_test_bundle')
          cache = root / 'http_cache'
          cache.mkdir(parents=True, exist_ok=True)

          UA = 'CardDataDeckPipeline/1.0'
          ACCEPT = 'application/json;q=0.9,*/*;q=0.8'
          deck_id = 'cac4a3fa-84f8-4b8e-b946-0d8a8086fd9d'

          def save_url(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': ACCEPT})
              body = None
              for attempt in range(7):
                  try:
                      with urllib.request.urlopen(req, timeout=45) as r:
                          body = r.read()
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code != 429 and not 500 <= exc.code <= 599:
                          raise
                      retry_after = exc.headers.get('Retry-After') if exc.headers else None
                      try:
                          delay = float(retry_after) if retry_after else min(2 ** attempt, 20)
                      except Exception:
                          delay = min(2 ** attempt, 20)
                      print('retry', exc.code, delay, url, flush=True)
                      time.sleep(max(delay, 0.5))
              if body is None:
                  raise RuntimeError(f'failed after retries: {url}')
              key = hashlib.sha256(url.encode()).hexdigest()
              (cache / key).write_bytes(body)
              print(url, '->', key, len(body), flush=True)
              time.sleep(0.35)
              return json.loads(body.decode('utf-8'))

          deck_url = f'https://api.scryfall.com/decks/{deck_id}/export/json'
          deck = save_url(deck_url)

          ids = []
          for section, rows in deck.get('entries', {}).items():
              if str(section).lower() == 'maybeboard':
                  continue
              for row in rows:
                  digest = row.get('card_digest') or {}
                  cid = digest.get('id')
                  if cid and cid not in ids:
                      ids.append(cid)

          cards = []
          for cid in ids:
              card = save_url(f'https://api.scryfall.com/cards/{cid}')
              cards.append(card)

          names = []
          for card in cards:
              name = str(card.get('name', ''))
              if name and name not in names:
                  names.append(name)

          for name in names:
              safe_name = name.replace('\\', '\\\\').replace('"', '\\"')
              query = f'!"{safe_name}" game:paper lang:en'
              params = {
                  'q': query,
                  'unique': 'prints',
                  'order': 'released',
                  'dir': 'desc',
              }
              url = 'https://api.scryfall.com/cards/search?' + urllib.parse.urlencode(params, doseq=True)
              save_url(url)

          import shutil
          shutil.copytree('derevi', root / 'derevi')
          (root / 'manifest.json').write_text(json.dumps({
              'deck_url': deck_url,
              'unique_card_ids': ids,
              'card_count': len(ids),
              'latest_search_count': len(names),
          }, indent=2), encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: derevi-pipeline-test-bundle
          path: pipeline_test_bundle/
          compression-level: 6
