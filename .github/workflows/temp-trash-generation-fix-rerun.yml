name: Retry trash controls and generation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-trash-generation-fix-rerun.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply corrected patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          text=Path('.github/workflows/temp-trash-generation-fix.yml').read_text(encoding='utf-8')
          start=text.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=text.index("\n          PY\n",start)
          source=textwrap.dedent(text[start:end])
          source=source.replace("_,settings,_=request(s,'/api/settings',{'revision':settings['revision'],'deletePermanently':True})","_,settings,_=request(s,'/api/settings',{'deletePermanently':True})")
          exec(compile(source,'embedded_patch.py','exec'),{'__name__':'__main__'})
          PY
      - name: Verify JavaScript syntax
        run: |
          node --check ProxyFoundry/site/settings.js
          node --check ProxyFoundry/site/deck.js
          node --check ProxyFoundry/site/render.js
      - name: Test full Bulk Proxy Forge suite
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/foundry/domain.py ProxyFoundry/foundry/workspace.py ProxyFoundry/foundry/storage.py ProxyFoundry/foundry/server.py ProxyFoundry/site/render.js ProxyFoundry/site/settings.js ProxyFoundry/site/deck.js ProxyFoundry/tests/test_app_rules.py ProxyFoundry/tests/test_server.py ProxyFoundry/tests/test_v54_integration.py
          git commit -m 'Fix generation invalidation and add trash controls'
          git push origin HEAD:main
