name: Temporary transparent-padding patch
on:
  push:
    branches:
      - bpf/trim-transparent-padding
    paths:
      - '.github/workflows/temp-trim-transparent-padding.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bpf/trim-transparent-padding
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply transparent padding trim
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise SystemExit(f'{path}: expected one replacement, found {text.count(old)}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          replace('ProxyFoundry/foundry/images.py',
          """def ingest_image(store,raw):
              im=decode_image(raw);out=io.BytesIO();im.save(out,'PNG')
              return store.add_asset(out.getvalue(),'image/png',im.width,im.height)
          """,
          """def trim_transparent_edges(im):
              alpha=im.getchannel('A');bbox=alpha.getbbox()
              if bbox is None or bbox==(0,0,im.width,im.height):return im
              return im.crop(bbox)

          def ingest_image(store,raw,*,trim_transparent_padding=False):
              im=decode_image(raw)
              if trim_transparent_padding:im=trim_transparent_edges(im)
              out=io.BytesIO();im.save(out,'PNG')
              return store.add_asset(out.getvalue(),'image/png',im.width,im.height)
          """)

          replace('ProxyFoundry/foundry/server.py',
          """        if p == '/api/uploads':
                      raw = self.body(); a = ingest_image(self.app.store, raw)
                      name = urllib.parse.unquote(self.headers.get('X-Filename', 'image.png'))
          """,
          """        if p == '/api/uploads':
                      raw = self.body()
                      kinds = q.get('kind', [])
                      trim = any(k in {'symbol', 'back'} for k in kinds)
                      a = ingest_image(self.app.store, raw, trim_transparent_padding=trim)
                      name = urllib.parse.unquote(self.headers.get('X-Filename', 'image.png'))
          """)

          replace('ProxyFoundry/site/ui.js',
          "export async function uploadImage(file,{symbol=false}={}){",
          "export async function uploadImage(file,{symbol=false,back=false}={}){")
          replace('ProxyFoundry/site/ui.js',
          "  return blobRequest('/api/uploads'+(symbol?'?kind=symbol':''),blob,'image/png',{'X-Filename':encodeURIComponent(file.name.replace(/\\.svg$/i,'.png'))});",
          "  const kind=symbol?'symbol':back?'back':'';\n  return blobRequest('/api/uploads'+(kind?('?kind='+encodeURIComponent(kind)):''),blob,'image/png',{'X-Filename':encodeURIComponent(file.name.replace(/\\.svg$/i,'.png'))});")

          replace('ProxyFoundry/site/backs.js',
          "      const image=await uploadImage(file);",
          "      const image=await uploadImage(file,{back:kind==='custom'});")
          replace('ProxyFoundry/site/backs.js',
          "<button type=\"button\" class=\"back-mode ${selected==='custom'?'selected':''}\" data-back-action=\"custom\" aria-pressed=\"${selected==='custom'}\" ${busy?'disabled':''}><b>Upload full back</b><small>Use your entire image as-is</small></button>",
          "<button type=\"button\" class=\"back-mode ${selected==='custom'?'selected':''}\" data-back-action=\"custom\" aria-pressed=\"${selected==='custom'}\" ${busy?'disabled':''}><b>Upload full back</b><small>Only fully transparent edge padding is trimmed</small></button>")
          replace('ProxyFoundry/site/backs.js',
          "${isIcon?'Fits inside the square without cropping or stretching. Only fully transparent padding is trimmed.':'The uploaded design is preserved. Deck backs do not replace a real double-faced reverse.'}",
          "${isIcon?'Fits inside the square without cropping or stretching. Only fully transparent padding is trimmed.':'Only fully transparent edge padding is trimmed. Otherwise the uploaded design is preserved. Deck backs do not replace a real double-faced reverse.'}")

          replace('ProxyFoundry/site/deck.js',
          "backOverride=(await uploadImage(file)).id;backDesignOverride={mode:'custom'};",
          "backOverride=(await uploadImage(file,{back:true})).id;backDesignOverride={mode:'custom'};")

          replace('ProxyFoundry/foundry/github_setup.py',
          """    def download(row):
                  nonlocal done
                  check_cancel()
                  progress(done, total, 'Importing ' + row['name'])
                  raw_url = 'https://raw.githubusercontent.com/' + loc['repo'] + '/' + ref + '/' + quote(row['path'], safe='/')
                  raw, _, _ = net.fetch(raw_url, refresh=True, ttl=0)
                  check_cancel()
                  try:
                      image = ingest_image(store, raw)
                  except ValidationError as exc:
                      raise ValidationError(row['name'] + ': ' + str(exc)) from exc
                  done += 1
                  progress(done, total, 'Imported ' + row['name'])
                  return image

              symbols = {r: download(row)['id'] for r, row in symbol_rows.items()} if symbol_rows else rarity_variants(store, download(single)['id'])
              if back:
                  back_settings = {'backAsset': download(back)['id'], 'backDesign': {'mode': 'custom'}}
          """,
          """    def download(row, *, trim_transparent_padding=False):
                  nonlocal done
                  check_cancel()
                  progress(done, total, 'Importing ' + row['name'])
                  raw_url = 'https://raw.githubusercontent.com/' + loc['repo'] + '/' + ref + '/' + quote(row['path'], safe='/')
                  raw, _, _ = net.fetch(raw_url, refresh=True, ttl=0)
                  check_cancel()
                  try:
                      image = ingest_image(store, raw, trim_transparent_padding=trim_transparent_padding)
                  except ValidationError as exc:
                      raise ValidationError(row['name'] + ': ' + str(exc)) from exc
                  done += 1
                  progress(done, total, 'Imported ' + row['name'])
                  return image

              symbols = {r: download(row, trim_transparent_padding=True)['id'] for r, row in symbol_rows.items()} if symbol_rows else rarity_variants(store, download(single, trim_transparent_padding=True)['id'])
              if back:
                  back_settings = {'backAsset': download(back, trim_transparent_padding=True)['id'], 'backDesign': {'mode': 'custom'}}
          """)

          p=Path('ProxyFoundry/tests/test_server.py'); text=p.read_text(encoding='utf-8')
          marker="def card(name='Sample Card'):\n"
          helper="""def padded_png(size, visible_box, color=(100,140,200,180)):
              out=io.BytesIO();im=Image.new('RGBA',size,(0,0,0,0))
              im.paste(color,visible_box);im.save(out,'PNG');return out.getvalue()

          """
          if marker not in text:raise SystemExit('test_server.py helper marker missing')
          text=text.replace(marker,helper+marker,1)
          marker='def test_back_catalog_and_composition_endpoint(running):\n'
          test="""def test_symbol_and_back_uploads_trim_only_fully_transparent_edges(running):
              app,s=running
              status,symbol,_=request(s,'/api/uploads?kind=symbol',padded_png((100,80),(10,15,70,55)),headers={'X-Filename':'rare.png'})
              assert status==200 and (symbol['width'],symbol['height'])==(60,40)
              status,back,_=request(s,'/api/uploads?kind=back',padded_png((400,600),(25,40,325,460),(15,40,80,255)),headers={'X-Filename':'back.png'})
              assert status==200 and (back['width'],back['height'])==(300,420)
              status,plain,_=request(s,'/api/uploads',padded_png((100,80),(10,15,70,55)),headers={'X-Filename':'art.png'})
              assert status==200 and (plain['width'],plain['height'])==(100,80)

          """
          if marker not in text:raise SystemExit('test_server.py test marker missing')
          p.write_text(text.replace(marker,test+marker,1),encoding='utf-8')

          p=Path('ProxyFoundry/tests/test_github_setup.py'); text=p.read_text(encoding='utf-8')
          marker='class BundleRemote:\n'
          helper="""def padded_png(size, visible_box, color=(100,140,200,180)):
              out=io.BytesIO();im=Image.new('RGBA',size,(0,0,0,0))
              im.paste(color,visible_box);im.save(out,'PNG');return out.getvalue()


          """
          if marker not in text:raise SystemExit('test_github_setup.py helper marker missing')
          text=text.replace(marker,helper+marker,1)
          marker='def test_precedence_four_images_over_single_and_complete_back_over_icon(tmp_path):\n'
          test="""def test_github_symbols_and_custom_back_trim_fully_transparent_padding(tmp_path):
              remote=BundleRemote(art=False,back='custom')
              remote.images[remote.child('set_symbols/common.png')]=padded_png((160,160),(20,30,120,110))
              remote.images[remote.child('back.png')]=padded_png((400,600),(25,40,325,460),(15,40,80,255))
              ws=workspace(tmp_path,remote);result=import_github_setup(ws,{'url':remote.url})
              common=decode_image(ws.store.asset_path(result['settings']['symbols']['common']).read_bytes())
              back=decode_image(ws.store.asset_path(result['settings']['backAsset']).read_bytes())
              assert common.size==(100,80) and back.size==(300,420)


          """
          if marker not in text:raise SystemExit('test_github_setup.py test marker missing')
          p.write_text(text.replace(marker,test+marker,1),encoding='utf-8')
          PY
          git diff --check
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verify Card Tools and run full suite
        env:
          PF_BROWSER: '1'
          PF_LIVE_CC: '1'
        run: |
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q --tb=short
      - name: Commit application changes
        run: |
          git config user.name 'Isaac Richards'
          git config user.email '44043352+andro951@users.noreply.github.com'
          git add ProxyFoundry/foundry/images.py ProxyFoundry/foundry/server.py ProxyFoundry/foundry/github_setup.py ProxyFoundry/site/ui.js ProxyFoundry/site/backs.js ProxyFoundry/site/deck.js ProxyFoundry/tests/test_server.py ProxyFoundry/tests/test_github_setup.py
          git commit -m 'Trim transparent padding from symbols and backs'
          git push origin HEAD:bpf/trim-transparent-padding
