name: Build The Aetherspark

on:
  push:
    paths:
      - '.run-aetherspark-build'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .aetherspark_support.py
            hulk_pack
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL
          sparse-checkout-cone-mode: true

      - name: Apply and syntax-check planeswalker support
        run: |
          python .aetherspark_support.py
          python -m py_compile CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/card_data_to_cardconjurer.py

      - name: Generate and validate The Aetherspark only
        run: |
          printf '%s\n' 'https://api.scryfall.com/cards/05690d52-06c4-40b1-8360-380418a83250' > /tmp/aetherspark.txt
          python CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_to_card_data.py \
            --project hulk_pack \
            --repo-project-path hulk_pack \
            --repo andro951/cards \
            --branch main \
            --list /tmp/aetherspark.txt \
            --flavor-policy latest \
            --request-delay 0.25 \
            -o /tmp/aetherspark_semantic.json
          python CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/card_data_to_cardconjurer.py \
            /tmp/aetherspark_semantic.json \
            -o /tmp/the_aetherspark.cardconjurer
          python - <<'PY'
          import json
          semantic=json.load(open('/tmp/aetherspark_semantic.json',encoding='utf-8'))['cards']
          assert len(semantic)==1
          assert semantic[0]['name']=='The Aetherspark'
          assert semantic[0]['loyalty']=='4'

          out=json.load(open('/tmp/the_aetherspark.cardconjurer',encoding='utf-8'))
          assert len(out)==1 and out[0]['key']=='The Aetherspark'
          d=out[0]['data']
          assert d['version']=='planeswalkerRegular'
          assert d['onload']=='/js/frames/versionPlaneswalker.js'
          assert len(d['frames'])==1
          assert d['frames'][0]['src']=='/img/frames/planeswalker/regular/planeswalkerFrameA.png'
          masks=[m['name'] for m in d['frames'][0]['masks']]
          assert masks==['Pinline','Title','Type','Frame','Border','Loyalty'],masks
          assert d['text']['loyalty']['text']=='4'
          assert d['planeswalker']['abilities']==['','+1','-5','-10'],d['planeswalker']['abilities']
          assert d['planeswalker']['count']==4
          assert d['text']['ability0']['text'].startswith('As long as The Aetherspark is attached')
          assert d['text']['ability1']['text'].startswith('Attach The Aetherspark')
          assert d['text']['ability2']['text']=='Draw two cards.'
          assert d['text']['ability3']['text']=='Add ten mana of any one color.'
          assert abs(sum(d['text'][f'ability{i}']['height'] for i in range(4))-0.2760)<1e-6
          print('Validated native artifact planeswalker output.')
          print('ability heights:',[d['text'][f'ability{i}']['height'] for i in range(4)])
          print('ability adjustments:',d['planeswalker']['abilityAdjust'])
          PY

      - name: Commit generic planeswalker support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/card_data_to_cardconjurer.py
          git commit -m "Add standard planeswalker support"
          git push

      - name: Upload The Aetherspark file
        uses: actions/upload-artifact@v4
        with:
          name: the-aetherspark-cardconjurer
          path: /tmp/the_aetherspark.cardconjurer
