name: Force pipeline rerender

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-force-pipeline-rerender.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Force fresh renders after pipeline upgrades
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace('ProxyFoundry/foundry/domain.py',
              "PIPELINE_VERSION='card-tools-v58/credits-v1/pipeline-v5'",
              "PIPELINE_VERSION='card-tools-v58/credits-v1/pipeline-v6'")

          replace('ProxyFoundry/foundry/workspace.py',
              "    def render_targets(self,deck_ids):\n        targets={};cached=0;errors=[]",
              "    def render_targets(self,deck_ids,force=False):\n        targets={};cached=0;errors=[]")
          replace('ProxyFoundry/foundry/workspace.py',
              "                    if self.store.render_get(comp['renderKey']):cached+=1;continue",
              "                    if not force and self.store.render_get(comp['renderKey']):cached+=1;continue")

          replace('ProxyFoundry/foundry/server.py',
              "from .domain import ValidationError, ConflictError, uid, slug, GROUP_LABELS",
              "from .domain import ValidationError, ConflictError, uid, slug, GROUP_LABELS, PIPELINE_VERSION")
          replace('ProxyFoundry/foundry/server.py',
              "    def start_render_session(self, ids):\n        plan = self.ws.render_targets(ids)",
              "    def start_render_session(self, ids, force=False):\n        plan = self.ws.render_targets(ids, force=force)")
          replace('ProxyFoundry/foundry/server.py',
              "        return {'id': ident, 'targets': [{'key': t['key'], 'name': t['name']} for t in targets.values()],\n                'cached': plan['cached'], 'errors': plan.get('errors', [])}",
              "        return {'id': ident, 'targets': [{'key': t['key'], 'name': t['name']} for t in targets.values()],\n                'cached': plan['cached'], 'errors': plan.get('errors', []), 'force': bool(force), 'pipelineVersion': PIPELINE_VERSION}")
          replace('ProxyFoundry/foundry/server.py',
              "            z.writestr('diagnostics.json', json.dumps({'version': '1.3.0', 'runtime': self.runtime.diagnostic(),\n                'workspace': {k: v for k, v in self.store.stats().items() if k != 'home'}}, indent=2))",
              "            z.writestr('diagnostics.json', json.dumps({'version': '1.3.0', 'pipelineVersion': PIPELINE_VERSION, 'runtime': self.runtime.diagnostic(),\n                'workspace': {k: v for k, v in self.store.stats().items() if k != 'home'}}, indent=2))")
          replace('ProxyFoundry/foundry/server.py',
              "            return self.respond({'version': '1.3.0', 'csrf': self.app.csrf, 'runtimeOrigin': self.app.runtime_origin,\n                                 'groups': GROUP_LABELS, 'settings': self.app.ws.global_settings(), 'stats': self.app.store.stats(), 'backs': self.app.ws.backs.catalog()})",
              "            return self.respond({'version': '1.3.0', 'pipelineVersion': PIPELINE_VERSION, 'csrf': self.app.csrf, 'runtimeOrigin': self.app.runtime_origin,\n                                 'groups': GROUP_LABELS, 'settings': self.app.ws.global_settings(), 'stats': self.app.store.stats(), 'backs': self.app.ws.backs.catalog()})")
          replace('ProxyFoundry/foundry/server.py',
              "        if p == '/api/render-sessions': return self.respond(self.app.start_render_session(d.get('deckIds', [])))",
              "        if p == '/api/render-sessions': return self.respond(self.app.start_render_session(d.get('deckIds', []), force=d.get('force') is True))")

          replace('ProxyFoundry/site/render.js',
              "export async function renderDecks(ids,{onUpdate=async()=>{},prepare=true}={}){",
              "export async function renderDecks(ids,{onUpdate=async()=>{},prepare=true,force=false}={}){")
          replace('ProxyFoundry/site/render.js',
              "    const plan=await api('/api/render-sessions',{deckIds:ids});",
              "    const plan=await api('/api/render-sessions',{deckIds:ids,force});")
          replace('ProxyFoundry/site/render.js',
              "    if(!plan.targets.length){if(plan.errors.length)throw new Error(plan.errors.join('\\n'));endActivity('All images are already up to date');toast('Cached images reused. No rendering needed.');return;}",
              "    if(!plan.targets.length){if(plan.errors.length)throw new Error(plan.errors.join('\\n'));endActivity('All images are already up to date');toast('Cached images reused. No rendering needed.');return;}\n    if(force)activity('Render deck','Pipeline upgrade','Ignoring cached PNGs and rebuilding every prepared face…',0,plan.targets.length);")

          replace('ProxyFoundry/site/deck.js',
              "${d.upgradeRequired?'<div class=\"notice info\">This deck was prepared with the previous Card Tools version. Generate images to apply v58 Station rendering and Flip spacing. Saved order ZIPs are unchanged.</div>':''}",
              "${d.upgradeRequired?`<div class=\"notice info\">This deck was prepared with an older render pipeline. Generate images will force a fresh render of every face. Running pipeline: ${esc(state.bootstrap.pipelineVersion||'unknown')}.</div>`:''}")
          replace('ProxyFoundry/site/deck.js',
              "  await renderDecks([d.id],{onUpdate:async()=>{if(state.route==='deck'&&state.activeDeck?.id===d.id)await showDeck(d.id,'cards');}});",
              "  await renderDecks([d.id],{force:!!d.upgradeRequired,onUpdate:async()=>{if(state.route==='deck'&&state.activeDeck?.id===d.id)await showDeck(d.id,'cards');}});")

          replace('ProxyFoundry/tests/test_server.py',
              "from foundry.images import ingest_image,rarity_variants",
              "from foundry.images import ingest_image,rarity_variants\nfrom foundry.domain import PIPELINE_VERSION")
          replace('ProxyFoundry/tests/test_server.py',
              "    assert request(s,'/api/bootstrap')[1]['runtimeOrigin']!=s.origin",
              "    bootstrap=request(s,'/api/bootstrap')[1]\n    assert bootstrap['runtimeOrigin']!=s.origin\n    assert bootstrap['pipelineVersion']==PIPELINE_VERSION")
          replace('ProxyFoundry/tests/test_server.py',
              "    assert app.ws.render_targets([d['id']])['cached']==1\n    assert app.ws.render_targets([d['id']])['targets']==[]",
              "    assert app.ws.render_targets([d['id']])['cached']==1\n    assert app.ws.render_targets([d['id']])['targets']==[]\n    forced=app.ws.render_targets([d['id']],force=True)\n    assert forced['cached']==0 and len(forced['targets'])==1\n    _,forced_session,_=request(s,'/api/render-sessions',{'deckIds':[d['id']],'force':True})\n    assert forced_session['force'] is True and forced_session['pipelineVersion']==PIPELINE_VERSION\n    assert len(forced_session['targets'])==1")
          PY
      - name: Test full Bulk Proxy Forge suite
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/foundry/domain.py ProxyFoundry/foundry/workspace.py ProxyFoundry/foundry/server.py ProxyFoundry/site/render.js ProxyFoundry/site/deck.js ProxyFoundry/tests/test_server.py
          git commit -m 'Force fresh renders after pipeline upgrades'
          git push origin HEAD:main
