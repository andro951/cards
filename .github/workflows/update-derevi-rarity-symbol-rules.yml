name: Update Derevi rarity symbol rules

on:
  push:
    paths:
      - 'derevi/rarity_symbol_rules_trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update style rules
        run: python derevi/update_rarity_symbol_rules.py
      - name: Commit update and clean temporary files
        run: |
          rm -f derevi/rarity_symbol_rules_trigger.txt
          rm -f derevi/update_rarity_symbol_rules.py
          rm -f .github/workflows/update-derevi-rarity-symbol-rules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/STYLE_RULES.md derevi/rarity_symbol_rules_trigger.txt derevi/update_rarity_symbol_rules.py .github/workflows/update-derevi-rarity-symbol-rules.yml
          git commit -m "Document rarity-specific Derevi set symbols"
          git push origin main
