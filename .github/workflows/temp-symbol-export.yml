name: Temporary symbol artifact export
on:
  push:
    paths:
      - '.github/workflows/temp-symbol-export.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: current-symbol-assets
          path: ProxyFoundry/assets/symbols/*.webp
          retention-days: 1
