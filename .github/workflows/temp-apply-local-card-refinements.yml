name: Temporary apply local card refinements

on:
  push:
    paths:
      - '.github/scripts/temp_apply_local_card_refinements.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact locally-validated files
        run: python .github/scripts/temp_apply_local_card_refinements.py
      - name: Commit refined card data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doctor_who/doctor_who_cards.cardconjurer derevi/derevi_cards.cardconjurer STYLE_RULES.md doctor_who/STYLE_RULES.md derevi/STYLE_RULES.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Refine sparse land boxes and MDFC layout'
            git push origin main
          fi
