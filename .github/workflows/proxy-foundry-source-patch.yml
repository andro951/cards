name: Apply Proxy Foundry source checkpoint
on:
  push:
    paths:
      - 'ProxyFoundry/checkpoints/*.patch'
permissions:
  contents: write
concurrency:
  group: proxy-foundry-source-patch
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProxyFoundry
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply only the readable source patches changed in this commit
        env:
          CHECKPOINT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess
          sha = os.environ['CHECKPOINT_SHA']
          names = subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r',sha], text=True).splitlines()
          patches = [p for p in names if re.fullmatch(r'ProxyFoundry/checkpoints/[A-Za-z0-9_-]+\.patch', p)]
          for p in patches:
              raw = pathlib.Path(p).read_text(encoding='utf-8')
              entries = re.findall(r'^diff --git a/(\S+) b/(\S+)$', raw, re.M)
              if not entries:
                  raise SystemExit('Empty or malformed checkpoint: '+p)
              for old,new in entries:
                  if old != new or not re.fullmatch(r'(foundry|site|extension|tests|scripts|docs)/[A-Za-z0-9_./-]+\.(py|js|css|html|json|txt|md|ini|bat)|run\.py|README\.md|RUN_TESTS\.bat|requirements(?:-dev)?\.txt',new):
                      raise SystemExit('Checkpoint path not allowed: '+new)
                  if '..' in pathlib.PurePosixPath(new).parts:
                      raise SystemExit('Unsafe checkpoint path')
              subprocess.run(['git','apply','--check','--directory=ProxyFoundry',p], check=True)
              subprocess.run(['git','apply','--directory=ProxyFoundry',p], check=True)
          PY
          python ProxyFoundry/scripts/verify_vendor.py
      - name: Save expanded, readable source files to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry
          if ! git diff --cached --quiet; then
            git commit -m 'Expand verified Proxy Foundry source checkpoint'
            git push origin HEAD:main
          fi
      - name: Install dependencies
        run: python -m pip install -r ProxyFoundry/requirements-dev.txt
      - name: Run Python regressions
        working-directory: ProxyFoundry
        run: python -m pytest -q --junitxml=test-results/unit.xml
      - name: Package recoverable source and evidence, excluding font/cache files
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('ProxyFoundry')
          with zipfile.ZipFile('ProxyFoundry-checkpoint.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or any(x in {'.venv','__pycache__','.pytest_cache','workspace','_work','.cache','node_modules','checkpoints'} for x in p.parts): continue
                  if p.suffix.lower() in {'.pyc','.ttf','.otf','.woff','.woff2','.pem','.crx'}: continue
                  z.write(p,p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProxyFoundry-expanded-checkpoint
          path: ProxyFoundry-checkpoint.zip
          retention-days: 7
