name: Sync current Scryfall rules

on:
  push:
    paths:
      - '.sync-current-scryfall'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync current Scryfall card data
        run: python derevi/sync_current_scryfall.py
      - name: Commit current Scryfall sync
        run: |
          rm -f .sync-current-scryfall
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer derevi/STYLE_RULES.md derevi/PROXY_SYNC_STATUS.md derevi/SCRYFALL_RULES_AUDIT.md derevi/scryfall_current_cards.json .sync-current-scryfall
          git commit -m "Sync Derevi proxies to current Scryfall rules"
          git push
