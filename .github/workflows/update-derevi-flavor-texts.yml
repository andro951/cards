name: Update Derevi flavor texts

on:
  push:
    paths:
      - 'derevi/flavor_text_trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update flavor text
        run: python derevi/update_flavor_texts.py
      - name: Commit update and clean temporary files
        run: |
          rm -f derevi/flavor_text_trigger.txt
          rm -f derevi/update_flavor_texts.py
          rm -f .github/workflows/update-derevi-flavor-texts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer derevi/flavor_text_trigger.txt derevi/update_flavor_texts.py .github/workflows/update-derevi-flavor-texts.yml
          git commit -m "Add finalized Derevi flavor text"
          git push origin main
