name: Temp BPF symbol folder browser test
on:
  push:
    paths: ['.github/workflows/temp-bpf-symbol-folder-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ProxyFoundry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ProxyFoundry/requirements-dev.txt
      - run: python -m playwright install chromium
      - name: Run symbol-folder browser regression
        working-directory: ProxyFoundry
        env:
          PF_BROWSER: '1'
          PF_TEST_BACK_ASSETS: '1'
        run: python -m pytest -q tests/test_browser.py::test_browser_symbol_folder_upload --tb=short
