name: Apply custom art artist credit fix

on:
  push:
    paths:
      - '.github/workflows/temp-update-modern-land-recipes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply custom art credit behavior
        run: python .github/scripts/temp_custom_artist_patch.py
      - name: Verify JavaScript and Python syntax
        run: |
          node --check ProxyFoundry/site/credits.js
          node --check ProxyFoundry/site/deck.js
          node --check ProxyFoundry/site/setup.js
          python -m py_compile ProxyFoundry/foundry/credits.py ProxyFoundry/foundry/compiler.py ProxyFoundry/foundry/domain.py
      - name: Test full Bulk Proxy Forge suite
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/foundry/domain.py ProxyFoundry/foundry/credits.py ProxyFoundry/foundry/compiler.py ProxyFoundry/site/credits.js ProxyFoundry/site/deck.js ProxyFoundry/site/setup.js ProxyFoundry/tests/test_credits.py ProxyFoundry/tests/test_custom_artist_prompt_contract.py
          git commit -m 'Require explicit artist credits for custom artwork'
          git push origin HEAD:main
