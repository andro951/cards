name: Verify batched ZIP transfer
on:
  push:
    branches: ['bpf/batched-zip-transfer-20260916']
    paths: ['.github/workflows/bpf-batched-zip-transfer.yml']
permissions:
  contents: write
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            ProxyFoundry
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply integrity-checked source patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = '''
          
          
          '''
          patch = lzma.decompress(base64.b64decode(''.join(encoded.split()), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8667e900722cd3b9a65313c3d624f9e2c83551db10ba54f5adc675111708f6d6'
          pathlib.Path('/tmp/bpf-batches.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/bpf-batches.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/bpf-batches.patch'], check=True)
          PY
      - name: Install tests and Chromium
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verify unchanged Card Tools
        run: python ProxyFoundry/scripts/verify_vendor.py
      - name: Full unit, API, installed extension, browser and native-render suite
        working-directory: ProxyFoundry
        env:
          PF_BROWSER: '1'
          PF_LIVE_CC: '1'
        run: python -m pytest -q --tb=short --junitxml=test-results/batched-zip.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batched-zip-test-results
          path: ProxyFoundry/test-results/batched-zip.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Commit tested source and remove this one-shot workflow
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/README.md ProxyFoundry/docs/HELPER_ZIP_BATCHES.md ProxyFoundry/extension/background.js ProxyFoundry/extension/bridge.js ProxyFoundry/extension/manifest.json ProxyFoundry/extension/site-bridge.js ProxyFoundry/extension/transfer-protocol.js ProxyFoundry/foundry/server.py ProxyFoundry/foundry/transfer_zip.py ProxyFoundry/site/app.js ProxyFoundry/site/orders.js ProxyFoundry/tests/test_extension.py ProxyFoundry/tests/test_print_bridge.py ProxyFoundry/tests/test_transfer_bridge.py ProxyFoundry/tests/test_transfer_protocol.py ProxyFoundry/tests/test_transfer_zip.py
          git rm .github/workflows/bpf-batched-zip-transfer.yml
          git commit -m 'Transfer full-quality orders as bounded paired ZIP batches'
          git push origin HEAD:bpf/batched-zip-transfer-20260916
