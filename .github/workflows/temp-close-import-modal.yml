name: Close import modal immediately

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-close-import-modal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            ProxyFoundry/site/deck.js
            ProxyFoundry/tests/test_browser.py
      - name: Patch import modal behavior and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          deck = Path('ProxyFoundry/site/deck.js')
          text = deck.read_text(encoding='utf-8')
          old = """    $('#do-import').disabled=true;\n    try{\n      const payload={source,includeOutside:$('#import-outside').checked,...(existing?{revision:existing.revision}:{name:$('#import-name').value.trim()})};\n      const d=await job(existing?'/api/decks/'+existing.id+'/add':'/api/decks/import',payload,{label:existing?'Add cards':'Import deck'});\n      closeModal();state.dirty=false;\n      if(existing){await showDeck(d.id,'cards');toast('Cards added. Generate images to prepare the new entries.');}\n      else nav('deck/'+d.id+'/setup');\n    }catch(e){errorBox($('.modal-body',host),e.message);const b=$('#do-import');if(b)b.disabled=false;}\n"""
          new = """    $('#do-import').disabled=true;\n    const payload={source,includeOutside:$('#import-outside').checked,...(existing?{revision:existing.revision}:{name:$('#import-name').value.trim()})};\n    closeModal();\n    try{\n      const d=await job(existing?'/api/decks/'+existing.id+'/add':'/api/decks/import',payload,{label:existing?'Add cards':'Import deck'});\n      state.dirty=false;\n      if(existing){await showDeck(d.id,'cards');toast('Cards added. Generate images to prepare the new entries.');}\n      else nav('deck/'+d.id+'/setup');\n    }catch(e){toast(e.message,true);}\n"""
          if old not in text:
              raise SystemExit('Expected import handler block not found; refusing blind edit')
          deck.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('ProxyFoundry/tests/test_browser.py')
          text = test.read_text(encoding='utf-8')
          old = "    page.click('#import-deck');page.fill('#import-name','Browser deck');page.fill('#import-source','2 A Test Creature');page.click('#do-import')\n    page.locator('#deck-name,.form-error,#retry-page').first.wait_for()\n"
          new = "    page.click('#import-deck');page.fill('#import-name','Browser deck');page.fill('#import-source','2 A Test Creature');page.click('#do-import')\n    assert page.locator('#modal-host .modal').count()==0\n    page.locator('#deck-name,.form-error,#retry-page').first.wait_for()\n"
          if old not in text:
              raise SystemExit('Expected browser import test block not found; refusing blind edit')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          grep -n -A12 "do-import.*onclick" ProxyFoundry/site/deck.js
          grep -n -A5 "Browser deck" ProxyFoundry/tests/test_browser.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/site/deck.js ProxyFoundry/tests/test_browser.py
          git commit -m 'Close import modal when import starts'
          git push origin HEAD:main
