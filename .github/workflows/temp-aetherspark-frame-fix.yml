name: Test corrected Aetherspark frame

on:
  push:
    paths:
      - '.run-aetherspark-frame-fix'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .planeswalker_frame_fix.py
            hulk_pack
            CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL
          sparse-checkout-cone-mode: true

      - name: Apply frame fix
        run: |
          python .planeswalker_frame_fix.py
          python -m py_compile CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/card_data_to_cardconjurer.py

      - name: Generate corrected Aetherspark only
        run: |
          printf '%s\n' 'https://api.scryfall.com/cards/05690d52-06c4-40b1-8360-380418a83250' > /tmp/aetherspark.txt
          python CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/scryfall_to_card_data.py \
            --project hulk_pack \
            --repo-project-path hulk_pack \
            --repo andro951/cards \
            --branch main \
            --list /tmp/aetherspark.txt \
            --flavor-policy latest \
            --request-delay 0.25 \
            -o /tmp/aetherspark_semantic.json
          python CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/card_data_to_cardconjurer.py \
            /tmp/aetherspark_semantic.json \
            -o /tmp/the_aetherspark_fixed.cardconjurer
          python - <<'PY'
          import json
          d=json.load(open('/tmp/the_aetherspark_fixed.cardconjurer',encoding='utf-8'))[0]['data']
          frames=d['frames']
          assert len(frames)==6, len(frames)
          assert all(len(f.get('masks',[]))==1 for f in frames)
          mask_names=[f['masks'][0]['name'] for f in frames]
          assert mask_names==['Pinline','Title','Type','Frame','Border','Loyalty'], mask_names
          assert any(f['masks'][0]['name']=='Border' for f in frames)
          assert any(f['masks'][0]['name']=='Frame' for f in frames)
          assert d['artBounds']=={'x':0.068,'y':0.101,'width':0.864,'height':0.8143}
          assert d['version']=='planeswalkerRegular'
          print('Corrected standard planeswalker frame serialization verified.')
          print('Frame layers:',mask_names)
          PY

      - name: Commit corrected planeswalker support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_CARD_PIPELINE_LAND_RULES_FILL_50_FULL/card_data_to_cardconjurer.py
          git commit -m "Fix planeswalker frame serialization"
          git push

      - name: Upload corrected Aetherspark
        uses: actions/upload-artifact@v4
        with:
          name: the-aetherspark-frame-fixed
          path: /tmp/the_aetherspark_fixed.cardconjurer
