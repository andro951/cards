name: Finalize Derevi card data

on:
  push:
    paths:
      - '.finalize-derevi-card-data'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize card data
        run: python derevi/finalize_card_data.py
      - name: Commit finalized data
        run: |
          rm -f .finalize-derevi-card-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derevi/derevi_cards.cardconjurer derevi/PROXY_SYNC_STATUS.md .finalize-derevi-card-data
          git commit -m "Finalize Derevi proxy card data"
          git push
