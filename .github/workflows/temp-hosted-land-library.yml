name: Apply hosted full-art land library

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hosted-land-library.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            ProxyFoundry
            .github/workflows/proxy-foundry-ci.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch hosted land library behavior and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          workspace='ProxyFoundry/foundry/workspace.py'
          replace(workspace,
              "from .backs import Backs\n\nDEFAULT_SETTINGS={'source':{'mode':'scryfall','githubFolder':'','ref':'','localFiles':{},'fallback':True},'symbols':{},'artist':'','modificationCredit':'','backAsset':None,'templateRules':{},'useLandLibrary':False,'landLibrary':'','disableAutofit':False,'refreshData':False,'flavorPolicy':'auto','acceptCropWarnings':False,'acceptLayoutWarnings':False}\nFRONT_SETTINGS={'source','symbols','artist','modificationCredit','templateRules','useLandLibrary','landLibrary','disableAutofit','flavorPolicy'}\n",
              "from .backs import Backs\n\nHOSTED_LAND_LIBRARY='https://github.com/andro951/cards/tree/main/ProxyFoundry/full_art_lands'\nDEFAULT_SETTINGS={'source':{'mode':'scryfall','githubFolder':'','ref':'','localFiles':{},'fallback':True},'symbols':{},'artist':'','modificationCredit':'','backAsset':None,'templateRules':{},'useLandLibrary':False,'disableAutofit':False,'refreshData':False,'flavorPolicy':'auto','acceptCropWarnings':False,'acceptLayoutWarnings':False}\nFRONT_SETTINGS={'source','symbols','artist','modificationCredit','templateRules','useLandLibrary','disableAutofit','flavorPolicy'}\n")
          replace(workspace,
              "    def global_settings(self):return self.store.get('settings','global') or {'id':'global','refreshData':False,'landLibrary':'','defaults':{}}\n    def set_global_settings(self,values):\n        old=self.global_settings();safe={k:v for k,v in values.items() if k in {'refreshData','landLibrary','defaults'}}\n        if safe.get('landLibrary'):github_location(safe['landLibrary'])\n",
              "    def global_settings(self):return self.store.get('settings','global') or {'id':'global','refreshData':False,'defaults':{}}\n    def set_global_settings(self,values):\n        old=self.global_settings();old.pop('landLibrary',None);safe={k:v for k,v in values.items() if k in {'refreshData','defaults'}}\n")
          replace(workspace,
              "        s={**copy.deepcopy(DEFAULT_SETTINGS),**settings,**self.backs.settings(settings)};s['source']={**DEFAULT_SETTINGS['source'],**s.get('source',{})}\n",
              "        s={**copy.deepcopy(DEFAULT_SETTINGS),**settings,**self.backs.settings(settings)};s['source']={**DEFAULT_SETTINGS['source'],**s.get('source',{})};s.pop('landLibrary',None)\n")
          replace(workspace,
              "        if s.get('useLandLibrary'):\n            url=s.get('landLibrary') or self.global_settings().get('landLibrary')\n            if not url:raise ValidationError('Add a land artwork library link in Settings, or turn the option off.')\n            progress(0,1,'Reading optional land artwork library');land_index=self.sources.github_index(url,refresh=bool(s['source'].get('refreshArt')))\n",
              "        if s.get('useLandLibrary'):\n            progress(0,1,'Reading hosted full-art land library');land_index=self.sources.github_index(HOSTED_LAND_LIBRARY)\n")

          setup='ProxyFoundry/site/setup.js'
          replace(setup,
              '''      <details><summary>Optional custom full-art land library</summary><label class="check-line"><input type="checkbox" id="use-land-library" ${s.useLandLibrary?'checked':''}><span>Use the land-art library for matching lands<small>Individual art overrides and your main custom-art folder take priority.</small></span></label><label class="field"><span>GitHub land-art folder <small>optional deck override</small></span><input id="land-library" value="${esc(s.landLibrary||'')}" placeholder="Use the library configured in Settings"><small>Expected format: <code>card_name.png</code>. Add the library link in Settings to make it available to every deck.</small></label></details>\n''',
              '''      <label class="check-line"><input type="checkbox" id="use-land-library" ${s.useLandLibrary?'checked':''}><span>Use the full-art land library<small>Uses matching lands from Bulk Proxy Forge's hosted library. Individual art overrides and your main custom-art folder take priority.</small></span></label>\n''')
          replace(setup,
              "    s.useLandLibrary=$('#use-land-library',root).checked;s.landLibrary=$('#land-library',root).value.trim();s.artist=$('#deck-artist',root).value;s.modificationCredit=$('#deck-modification',root).value.trim();\n",
              "    s.useLandLibrary=$('#use-land-library',root).checked;s.artist=$('#deck-artist',root).value;s.modificationCredit=$('#deck-modification',root).value.trim();\n")

          settings='ProxyFoundry/site/settings.js'
          replace(settings,
              '''<label class="field section-gap"><span>Optional full-art land library</span><input id="global-land-library" value="${esc(settings.landLibrary||'')}" placeholder="https://github.com/owner/repo/tree/main/land_art"><small>Use your custom land art by enabling it in a deck’s setup. Filenames are matched as <code>card_name.png</code>; no URL is assumed until you provide one.</small></label>''',
              '')
          replace(settings,
              "  $('#save-settings').onclick=()=>attempt(async()=>{const out=await api('/api/settings',{revision:settings.revision,refreshData:$('#global-refresh').checked,landLibrary:$('#global-land-library').value.trim()});state.bootstrap.settings=out;toast('Settings saved.');await showSettings();});\n",
              "  $('#save-settings').onclick=()=>attempt(async()=>{const out=await api('/api/settings',{revision:settings.revision,refreshData:$('#global-refresh').checked});state.bootstrap.settings=out;toast('Settings saved.');await showSettings();});\n")

          backup='ProxyFoundry/foundry/backup.py'
          replace(backup,
              "                self.ws.set_global_settings({k: defaults[k] for k in ('refreshData', 'landLibrary', 'defaults') if k in defaults})\n",
              "                self.ws.set_global_settings({k: defaults[k] for k in ('refreshData', 'defaults') if k in defaults})\n")

          readme='ProxyFoundry/README.md'
          replace(readme,
              "The optional full-art land library is **unset by default**. Add its GitHub folder in Settings and enable it for a deck. It expects `card_name.png`. Individual art overrides and the main custom-art folder take priority.\n",
              "The optional full-art land library is hosted by Bulk Proxy Forge. Enable it with the single checkbox in a deck's Artwork setup; matching filenames in `full_art_lands/` are used automatically. Individual art overrides and the main custom-art folder take priority.\n")

          ci='.github/workflows/proxy-foundry-ci.yml'
          replace(ci,
              "                  if not p.is_file() or any(x in {'.venv', '__pycache__', '.pytest_cache', 'workspace', '_work', '.cache', 'node_modules', 'checkpoints'} for x in p.parts):\n",
              "                  if not p.is_file() or any(x in {'.venv', '__pycache__', '.pytest_cache', 'workspace', '_work', '.cache', 'node_modules', 'checkpoints', 'full_art_lands'} for x in p.parts):\n")

          test=Path('ProxyFoundry/tests/test_hosted_land_library.py')
          test.write_text('''from pathlib import Path\n\nfrom foundry.workspace import DEFAULT_SETTINGS, FRONT_SETTINGS, HOSTED_LAND_LIBRARY\n\n\ndef test_land_library_is_app_hosted_and_not_user_configurable():\n    assert HOSTED_LAND_LIBRARY == "https://github.com/andro951/cards/tree/main/ProxyFoundry/full_art_lands"\n    assert "landLibrary" not in DEFAULT_SETTINGS\n    assert "landLibrary" not in FRONT_SETTINGS\n    assert Path("full_art_lands").is_dir()\n    assert any(p.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp", ".gif"} for p in Path("full_art_lands").iterdir())\n\n\ndef test_land_library_ui_is_one_checkbox_only():\n    setup=Path("site/setup.js").read_text(encoding="utf-8")\n    settings=Path("site/settings.js").read_text(encoding="utf-8")\n    workspace=Path("foundry/workspace.py").read_text(encoding="utf-8")\n    assert setup.count('id="use-land-library"') == 1\n    assert 'id="land-library"' not in setup\n    assert "GitHub land-art folder" not in setup\n    assert "Optional custom full-art land library" not in setup\n    assert "global-land-library" not in settings\n    assert "s.get('landLibrary')" not in workspace\n    assert "self.global_settings().get('landLibrary')" not in workspace\n''',encoding='utf-8')
          PY
      - name: Install and test
        run: |
          python -m pip install -r ProxyFoundry/requirements-dev.txt
          python ProxyFoundry/scripts/verify_vendor.py
          cd ProxyFoundry
          python -m pytest -q tests/test_hosted_land_library.py tests/test_art_cache.py tests/test_app_rules.py
      - name: Commit hosted land library behavior
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProxyFoundry/foundry/workspace.py ProxyFoundry/foundry/backup.py ProxyFoundry/site/setup.js ProxyFoundry/site/settings.js ProxyFoundry/README.md ProxyFoundry/tests/test_hosted_land_library.py .github/workflows/proxy-foundry-ci.yml
          git commit -m 'Use hosted full-art land library'
          git push origin HEAD:main
